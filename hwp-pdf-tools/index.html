  <header>
    <div class="brand"><span class="mark" aria-hidden="true">한</span>한글 PDF 변환</div>
    <span class="privacy">서버 업로드 없음</span>
  </header>
  <main>
    <div class="art" aria-hidden="true"><span class="page">HWP</span><span class="dots"><i></i><i></i><i></i></span><span class="page pdf">PDF</span></div>
    <h1>한글 파일을 <span>바로 PDF로</span></h1>
    <p class="intro">한글 파일 여러 개를 선택하면 파일마다 PDF로 변환됩니다.</p>
    <nav class="tools" aria-label="파일 도구">
      <a href="./" aria-current="page">한글 PDF 변환</a>
      <a href="./compress.html">사진 용량 줄이기</a>
      <a href="./compress.html?type=pdf">PDF 용량 줄이기</a>
      <a href="./guide.html">사용 안내</a>
    </nav>
    <section class="work" aria-label="파일 변환">
      <div class="zone" id="zone">
        <h2>파일을 여기에 놓으세요</h2>
        <p class="formats" id="formats">.hwp · .hwpx · 파일당 50 MB · 최대 30개, 합계 250 MB</p>
        <button type="button" id="pick" aria-describedby="formats">한글 파일 선택</button>
        <input type="file" id="file" accept=".hwp,.hwpx" multiple hidden>
      </div>
      <div class="batch-options">
        <label><input id="optimize" type="checkbox"> 변환 후 PDF 용량도 줄이기</label>
        <label><input id="choose-location" type="checkbox"> 자동 다운로드 대신 저장 위치 직접 선택</label>
        <p class="batch-selection" id="selection"></p>
        <div class="batch-actions">
          <button id="start" type="button" disabled>PDF로 변환</button>
          <button class="batch-secondary" id="clear" type="button" hidden>선택 초기화</button>
        </div>
      </div>
      <div class="result" id="result" hidden>
        <div role="status" aria-live="polite" aria-atomic="true">
          <p class="status" id="status"></p>
          <p class="small" id="detail"></p>
        </div>
        <ul class="batch-rows" id="rows" aria-label="파일별 처리 결과"></ul>
        <div class="batch-actions">
          <button class="download" id="zip" type="button" hidden>전체 ZIP 다운로드</button>
          <button class="download" id="zip-location" type="button" hidden>ZIP 저장 위치 선택</button>
          <button class="download" id="pdf-download" type="button" hidden>PDF 각각 다운로드</button>
          <button class="download" id="pdf-folder" type="button" hidden>폴더 선택 후 PDF 모두 저장</button>
        </div>
        <p class="small" id="save-hint" hidden></p>
        <div id="zip-ready"></div>
        <p class="small" id="zip-status" role="status"></p>
      </div>
    </section>
    <p class="note">문서는 브라우저 안에서만 처리됩니다.<br>글꼴이나 복잡한 서식은 원본과 다르게 표시될 수 있습니다. <a href="https://sanguneo.github.io/rhwptopdf/" rel="noreferrer" id="fallback" hidden>변환 엔진 데모 열기</a></p>
  </main>
  <footer>변환 엔진 <a href="https://github.com/sanguneo/rhwptopdf" rel="noreferrer">rhwptopdf</a> · <a href="./guide.html#privacy">개인정보 및 광고 안내</a></footer>
  <noscript>파일을 변환하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>

  <script id="worker-source" type="text/plain">
    const engineVersion = 'v0.2.2';
    const fontVersion = '06bfe0d62a98375cb09c942fa18e68bd32cff057';
    const wasmFile = 'rhwptopdf.umd_bg.wasm';
    let engineReady;

    async function getBytes(urls, valid) {
      const controller = new AbortController();
      try {
        return await Promise.any(urls.map(async (url) => {
          const signal = AbortSignal.any([controller.signal, AbortSignal.timeout(18000)]);
          const response = await fetch(url, { credentials: 'omit', signal });
          if (!response.ok) throw new Error('Resource unavailable');
          const bytes = new Uint8Array(await response.arrayBuffer());
          if (!valid(bytes)) throw new Error('Invalid resource');
          return bytes;
        }));
      } finally {
        controller.abort();
      }
    }
    function getFont(path) {
      return getBytes([
        'https://cdn.jsdelivr.net/gh/google/fonts@' + fontVersion + '/ofl/' + path,
        'https://raw.githubusercontent.com/google/fonts/' + fontVersion + '/ofl/' + path
      ], (bytes) => bytes.length > 1000 && bytes[0] === 0 && bytes[1] === 1 && bytes[2] === 0 && bytes[3] === 0);
    }
    async function initialize() {
      const engine = self.RhwpToPdf;
      const wasm = await getBytes([
        'https://cdn.jsdelivr.net/gh/sanguneo/rhwptopdf@' + engineVersion + '/demo/vendor/' + wasmFile,
        'https://raw.githubusercontent.com/sanguneo/rhwptopdf/' + engineVersion + '/demo/vendor/' + wasmFile,
        'https://sanguneo.github.io/rhwptopdf/vendor/' + wasmFile
      ], (bytes) => bytes.length === 6309488 && bytes[0] === 0 && bytes[1] === 97 && bytes[2] === 115 && bytes[3] === 109);
      await engine({ module_or_path: wasm });
      const fonts = await Promise.allSettled([
        getFont('nanumgothic/NanumGothic-Regular.ttf'),
        getFont('nanummyeongjo/NanumMyeongjo-Regular.ttf')
      ]);
      let registered = 0;
      for (const font of fonts) {
        if (font.status !== 'fulfilled') continue;
        try {
          if (engine.registerPdfFont(font.value)) registered++;
        } catch {
          // The other Korean font can also render the document.
        }
      }
      if (!registered) throw new Error('Korean font unavailable');
      return engine;
    }
    self.onmessage = async ({ data }) => {
      let engine;
      try {
        engineReady ??= initialize();
        engine = await engineReady;
      } catch {
        engineReady = undefined;
        self.postMessage({ type: 'engine-error', message: '변환 엔진이나 한글 글꼴을 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.' });
        return;
      }
      self.postMessage({ type: 'converting' });
      try {
        const source = new Uint8Array(data);
        const info = engine.analyzeHwp(source);
        const { pageCount } = info;
        info.free?.();
        if (!Number.isInteger(pageCount) || pageCount < 1) throw new Error('Empty document');
        const pdf = engine.hwpToPdf(source);
        if (new TextDecoder().decode(pdf.subarray(0, 5)) !== '%PDF-') throw new Error('Invalid PDF');
        const bytes = pdf.slice().buffer;
        self.postMessage({ type: 'done', bytes, pageCount }, [bytes]);
      } catch {
        self.postMessage({ type: 'error', message: '문서를 PDF로 바꾸지 못했어요. 파일이 한글에서 열리는지, 암호가 걸려 있는지 확인해 주세요.' });
      }
    };
  </script>
  <script>
    const batchLimit = 30;
    const batchBytes = 250_000_000;
    const numberFormat = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 1 });
    let pdfLibLoading;

    function formatBytes(bytes) {
      if (bytes >= 1_000_000) return numberFormat.format(bytes / 1_000_000) + ' MB';
      if (bytes >= 1_000) return numberFormat.format(bytes / 1_000) + ' KB';
      return bytes + ' B';
    }

    function loadPdfLib() {
      pdfLibLoading ??= new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
        script.crossOrigin = 'anonymous';
        const fail = () => {
          clearTimeout(timer);
          script.remove();
          reject(new Error('PDF_TOOL'));
        };
        const timer = setTimeout(fail, 18000);
        script.onerror = fail;
        script.onload = () => {
          if (!window.PDFLib?.PDFDocument) return fail();
          clearTimeout(timer);
          resolve(window.PDFLib.PDFDocument);
        };
        document.head.append(script);
      }).catch(error => {
        pdfLibLoading = undefined;
        throw error;
      });
      return pdfLibLoading;
    }

    async function optimizePdf(bytes, PDFDocument) {
      const pdf = await PDFDocument.load(bytes, { updateMetadata: false });
      return pdf.save({ useObjectStreams: true, updateFieldAppearances: false, addDefaultPage: false });
    }

    const crcTable = Uint32Array.from({ length: 256 }, (_, value) => {
      for (let bit = 0; bit < 8; bit++) value = (value >>> 1) ^ (value & 1 ? 0xedb88320 : 0);
      return value;
    });

    async function zipResults(entries) {
      const parts = [], directory = [];
      const encoder = new TextEncoder();
      let offset = 0, directorySize = 0;
      for (const { name, blob } of entries) {
        const filename = encoder.encode(name);
        let crc = 0xffffffff;
        for await (const chunk of blob.stream()) {
          for (const byte of chunk) crc = (crc >>> 8) ^ crcTable[(crc ^ byte) & 255];
        }
        crc = (crc ^ 0xffffffff) >>> 0;
        const local = new DataView(new ArrayBuffer(30));
        const central = new DataView(new ArrayBuffer(46));
        local.setUint32(0, 0x04034b50, true);
        central.setUint32(0, 0x02014b50, true);
        central.setUint16(4, 20, true);
        for (const [header, start] of [[local, 4], [central, 6]]) {
          header.setUint16(start, 20, true);
          header.setUint16(start + 2, 0x0800, true);
          header.setUint16(start + 8, 33, true);
          header.setUint32(start + 10, crc, true);
          header.setUint32(start + 14, blob.size, true);
          header.setUint32(start + 18, blob.size, true);
          header.setUint16(start + 22, filename.length, true);
        }
        central.setUint32(42, offset, true);
        offset += 30 + filename.length + blob.size;
        directorySize += 46 + filename.length;
        if (offset + directorySize + 22 >= 0xffffffff) throw new Error('ZIP_TOO_LARGE');
        parts.push(local.buffer, filename, blob);
        directory.push(central.buffer, filename);
      }
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true);
      end.setUint16(8, entries.length, true);
      end.setUint16(10, entries.length, true);
      end.setUint32(12, directorySize, true);
      end.setUint32(16, offset, true);
      return new Blob([...parts, ...directory, end.buffer], { type: 'application/zip' });
    }

    async function writeDownload(handle, blob) {
      const writable = await handle.createWritable();
      try {
        await writable.write(blob);
        await writable.close();
      } catch (error) {
        await writable.abort().catch(() => {});
        throw error;
      }
    }

    async function newFileIn(folder, name) {
      const dot = name.lastIndexOf('.');
      const stem = dot > 0 ? name.slice(0, dot) : name;
      const extension = dot > 0 ? name.slice(dot) : '';
      let candidate = name;
      for (let suffix = 2; ; suffix++) {
        try {
          await folder.getFileHandle(candidate);
        } catch (error) {
          if (error.name === 'NotFoundError') return folder.getFileHandle(candidate, { create: true });
          if (error.name !== 'TypeMismatchError') throw error;
        }
        candidate = stem + ' (' + suffix + ')' + extension;
      }
    }

    function bindBatch({ area, controls, process, maxSize, extensions, archive, directPdf = false, autoStart = false, autoDownload = () => false }) {
      const get = id => document.getElementById(id);
      const [input, picker, start, clear, selection, result, status, detail, rows, zip, zipStatus] =
        ['file', 'pick', 'start', 'clear', 'selection', 'result', 'status', 'detail', 'rows', 'zip', 'zip-status'].map(get);
      const [zipLocation, pdfDownload, pdfFolder, saveHint] =
        ['zip-location', 'pdf-download', 'pdf-folder', 'save-hint'].map(get);
      const canChooseFile = typeof window.showSaveFilePicker === 'function';
      const canChooseFolder = typeof window.showDirectoryPicker === 'function';
      let files = [], busy = false, zipBusy = false, entries = [], urls = [], archiveBlob;
      let saveButtons = [];

      function refresh() {
        const locked = busy || zipBusy;
        picker.disabled = clear.disabled = locked;
        start.disabled = locked || !files.length;
        clear.hidden = !files.length;
        for (const button of [zip, zipLocation, pdfDownload, pdfFolder, ...saveButtons]) button.disabled = locked;
        controls.forEach(control => { control.disabled = locked; });
        selection.textContent = files.length ? files.length + '개 선택 · ' + formatBytes(files.reduce((sum, file) => sum + file.size, 0)) : '선택한 파일이 없습니다.';
      }
      function resetResults() {
        urls.forEach(url => URL.revokeObjectURL(url));
        urls = [];
        entries = [];
        saveButtons = [];
        archiveBlob = undefined;
        zipLocation.hidden = pdfDownload.hidden = pdfFolder.hidden = saveHint.hidden = true;
        rows.replaceChildren();
        get('zip-ready').replaceChildren();
        detail.textContent = '';
        zipStatus.textContent = '';
        zip.hidden = true;
        zip.textContent = '전체 ZIP 다운로드';
        result.hidden = true;
      }
      function linkFor(blob, name, text) {
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        urls.push(url);
        link.href = url;
        link.download = name;
        link.textContent = text;
        return link;
      }
      async function saveOne(name, getBlob) {
        if (busy || zipBusy) return;
        zipBusy = true;
        refresh();
        zipStatus.textContent = '';
        try {
          const handle = await window.showSaveFilePicker({ suggestedName: name, id: 'file-tool-save' });
          zipStatus.textContent = '파일을 저장하는 중…';
          await writeDownload(handle, await getBlob());
          zipStatus.textContent = handle.name + ' 저장 완료';
        } catch (error) {
          if (error.name !== 'AbortError') zipStatus.textContent = '선택한 위치에 저장하지 못했어요. 다른 폴더를 선택하거나 일반 다운로드를 이용해 주세요.';
        } finally {
          zipBusy = false;
          refresh();
        }
      }
      async function saveAllPdfs() {
        if (busy || zipBusy || !directPdf || entries.length < 2) return;
        zipBusy = true;
        refresh();
        let folder, saved = 0;
        zipStatus.textContent = '';
        try {
          folder = await window.showDirectoryPicker({ mode: 'readwrite', id: 'file-tool-pdf-folder' });
          for (const entry of entries) {
            zipStatus.textContent = (saved + 1) + ' / ' + entries.length + ' PDF 저장 중…';
            await writeDownload(await newFileIn(folder, entry.name), entry.blob);
            saved++;
          }
          zipStatus.textContent = folder.name + ' 폴더에 PDF ' + saved + '개 저장 완료';
        } catch (error) {
          if (folder || error.name !== 'AbortError') {
            zipStatus.textContent = 'PDF ' + saved + '개 저장 · 나머지는 파일별 다운로드를 이용해 주세요.';
          }
        } finally {
          zipBusy = false;
          refresh();
        }
      }
      function getArchive() {
        return archiveBlob ??= zipResults(entries).catch(error => {
          archiveBlob = undefined;
          throw error;
        });
      }
      function uniqueName(name) {
        name = name.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_');
        const dot = name.lastIndexOf('.');
        const base = dot > 0 ? name.slice(0, dot) : name;
        const extension = dot > 0 ? name.slice(dot) : '';
        let candidate = name, number = 2;
        while (entries.some(entry => entry.name.toLowerCase() === candidate.toLowerCase())) {
          candidate = base + ' (' + number++ + ')' + extension;
        }
        return candidate;
      }
      function addRow(file, message, output, error = false) {
        const item = document.createElement('li');
        const name = document.createElement('strong');
        const info = document.createElement('span');
        name.textContent = file.name;
        info.textContent = message;
        if (error) info.className = 'batch-error';
        item.append(name, info);
        let link;
        if (output) {
          const outputName = uniqueName(output.name);
          entries.push({ name: outputName, blob: output.blob });
          link = linkFor(output.blob, outputName, output.original ? '원본 다운로드' : '다운로드');
          const actions = document.createElement('div');
          actions.className = 'batch-file-actions';
          actions.append(link);
          if (canChooseFile) {
            const save = document.createElement('button');
            save.type = 'button';
            save.className = 'batch-secondary';
            save.textContent = '저장 위치 선택';
            save.setAttribute('aria-label', outputName + ' 저장 위치 선택');
            save.addEventListener('click', () => saveOne(outputName, () => output.blob));
            saveButtons.push(save);
            actions.append(save);
          }
          item.append(actions);
        }
        rows.append(item);
        return link;
      }
      async function run() {
        if (busy || zipBusy || !files.length) return;
        resetResults();
        busy = true;
        result.hidden = false;
        refresh();
        let completed = 0, failed = 0, original = 0, singleLink;
        try {
          for (const [index, file] of files.entries()) {
            status.textContent = (index + 1) + ' / ' + files.length + ' 처리 중';
            detail.textContent = file.name;
            if (!extensions.test(file.name) || !file.size || file.size > maxSize) {
              addRow(file, '지원 형식과 파일당 용량을 확인해 주세요.', null, true);
              failed++;
              continue;
            }
            try {
              const output = await process(file, step => { detail.textContent = file.name + ' · ' + step; });
              singleLink = addRow(file, output.message, output);
              if (output.original) original++;
              else completed++;
            } catch (error) {
              addRow(file, error.message || '파일을 처리하지 못했어요.', null, true);
              failed++;
            }
          }
          status.textContent = '완료 ' + completed + '개' + (original ? ' · 원본 유지 ' + original + '개' : '') + (failed ? ' · 실패 ' + failed + '개' : '');
          detail.textContent = '';
          const multiple = entries.length > 1;
          zip.hidden = !multiple;
          zipLocation.hidden = !multiple || !canChooseFile;
          pdfDownload.hidden = !multiple || !directPdf;
          pdfFolder.hidden = !multiple || !directPdf || !canChooseFolder;
          if (entries.length && !canChooseFile) {
            saveHint.hidden = false;
            saveHint.textContent = '다운로드 위치를 고르려면 브라우저 다운로드 설정에서 저장 위치 확인을 켜 주세요.';
          }
          if (files.length === 1 && singleLink && autoDownload()) singleLink.click();
        } finally {
          busy = false;
          refresh();
        }
      }
      function select(list) {
        if (busy || zipBusy || !list.length) return;
        resetResults();
        files = Array.from(list);
        if (files.length > batchLimit || files.reduce((sum, file) => sum + file.size, 0) > batchBytes) {
          files = [];
          result.hidden = false;
          status.textContent = '한 번에 최대 30개, 합계 250 MB까지 선택할 수 있어요.';
        }
        refresh();
        if (autoStart) void run();
      }

      picker.addEventListener('click', () => input.click());
      input.addEventListener('change', () => { select(input.files); input.value = ''; });
      start.addEventListener('click', run);
      controls.forEach(control => control.addEventListener('change', resetResults));
      clear.addEventListener('click', () => { files = []; resetResults(); refresh(); });
      zipLocation.addEventListener('click', () => saveOne(archive, getArchive));
      pdfFolder.addEventListener('click', saveAllPdfs);
      pdfDownload.addEventListener('click', () => {
        if (busy || zipBusy || !directPdf) return;
        for (const link of rows.querySelectorAll('a[download]')) link.click();
        zipStatus.textContent = 'PDF 다운로드를 요청했어요. 브라우저에서 여러 파일 다운로드 허용을 묻는 경우 허용해 주세요.';
      });
      zip.addEventListener('click', async () => {
        if (busy || zipBusy || entries.length < 2) return;
        zipBusy = true;
        refresh();
        zipStatus.textContent = 'ZIP 만드는 중…';
        try {
          const link = linkFor(await getArchive(), archive, 'ZIP 다운로드');
          get('zip-ready').replaceChildren(link);
          zipStatus.textContent = '';
          link.click();
          zip.hidden = true;
        } catch {
          zipStatus.textContent = 'ZIP을 만들지 못했어요. 파일별 다운로드를 이용해 주세요.';
        } finally {
          zipBusy = false;
          refresh();
        }
      });
      window.addEventListener('dragover', event => {
        if (event.dataTransfer.types.includes('Files')) event.preventDefault();
      });
      window.addEventListener('drop', event => {
        if (event.dataTransfer.files.length) event.preventDefault();
      });
      area.addEventListener('dragover', event => {
        if (!event.dataTransfer.types.includes('Files')) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = busy || zipBusy ? 'none' : 'copy';
        area.classList.toggle('active', !busy && !zipBusy);
      });
      area.addEventListener('dragleave', event => {
        if (!area.contains(event.relatedTarget)) area.classList.remove('active');
      });
      area.addEventListener('drop', event => {
        event.preventDefault();
        area.classList.remove('active');
        select(event.dataTransfer.files);
      });
      refresh();
    }

    const el = id => document.getElementById(id);
    const optimize = el('optimize');
    let worker;

    function convertPdf(bytes, progress) {
      if (!worker) {
        const url = URL.createObjectURL(new Blob([el('engine-source').textContent, '\n', el('worker-source').textContent], { type: 'text/javascript' }));
        try {
          worker = new Worker(url);
        } finally {
          URL.revokeObjectURL(url);
        }
      }
      return new Promise((resolve, reject) => {
        const job = worker;
        function finish(error, data, reset = false) {
          clearTimeout(timer);
          job.onmessage = job.onerror = job.onmessageerror = null;
          if (reset) {
            job.terminate();
            worker = undefined;
          }
          if (error) reject(new Error(error));
          else resolve(data);
        }
        const timer = setTimeout(() => finish('처리 시간이 너무 길어 이 파일을 건너뛰었어요.', null, true), 120000);
        job.onerror = job.onmessageerror = () => finish('변환 도구를 시작하지 못했어요.', null, true);
        job.onmessage = ({ data }) => {
          if (data.type === 'converting') progress('PDF로 변환 중');
          else if (data.type === 'done') finish(null, data);
          else if (data.type === 'error' || data.type === 'engine-error') {
            if (data.type === 'engine-error') el('fallback').hidden = false;
            finish(data.message, null, data.type === 'engine-error');
          }
        };
        try {
          job.postMessage(bytes, [bytes]);
        } catch {
          finish('파일을 변환 도구에 전달하지 못했어요.', null, true);
        }
      });
    }

    bindBatch({
      area: el('zone'), controls: [optimize], maxSize: 50_000_000,
      extensions: /\.(hwp|hwpx)$/i, archive: '변환한-PDF.zip', directPdf: true, autoStart: true,
      autoDownload: () => !el('choose-location').checked,
      async process(file, progress) {
        const { bytes, pageCount } = await convertPdf(await file.arrayBuffer(), progress);
        const name = file.name.replace(/\.(hwp|hwpx)$/i, '') + '.pdf';
        let blob = new Blob([bytes], { type: 'application/pdf' });
        let message = pageCount + '쪽 · ' + formatBytes(blob.size);
        if (optimize.checked) {
          progress('변환한 PDF 압축 중');
          try {
            const smaller = await optimizePdf(bytes, await loadPdfLib());
            if (smaller.byteLength < blob.size) {
              message = pageCount + '쪽 · ' + formatBytes(blob.size) + ' → ' + formatBytes(smaller.byteLength);
              blob = new Blob([smaller], { type: 'application/pdf' });
            } else {
              message += ' · 추가로 줄일 수 있는 용량 없음';
            }
          } catch {
            message += ' · 추가 압축 실패, 변환한 PDF 저장 가능';
          }
        }
        return { name, blob, message };
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아침 열기 칠판 · 학교 급식 자동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 1440×810 교실 칠판 한 장을 화면에 맞춰 통째로 키움. 위: 반 이름·지금 단계·도구 / 가운데: 활동 / 아래: 이전·단계 띠·다음 */
:root{
  color-scheme: light;
  --paper:#EDF3EE;
  --card:#FFFFFF;
  --ink:#1E2944;
  --muted:#5D6A7C;
  --line:#D3DED6;
  --accent:#F2732B;
  --accent-soft:#FFE6D6;
  --sun:#FFC63A;
  --sky:#3F8FDE;
  --berry:#DE4870;
  --leaf:#2E9B66;
  --leaf-soft:#DDF3E7;
  --no:#B9C2CC;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#fit{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;display:grid;grid-template-rows:96px 610px 104px;background:var(--paper);overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 위 띠 */
.top{display:flex;align-items:center;gap:24px;padding:0 32px;border-bottom:3px solid var(--line);background:var(--card)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:150px;max-width:260px}
.brand b{font-family:var(--display);font-size:34px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:16px;color:var(--muted);font-weight:500}
.today{flex:1;min-width:0;font-size:20px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-badge{display:inline-flex;align-items:center;gap:12px;padding:6px 18px 6px 7px;border:2px solid #F6CEB5;border-radius:22px;background:#FFF3E9;font-family:var(--display);font-size:30px;color:var(--ink)}
.step-count{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;font-size:25px}
.clock{font-family:var(--display);font-size:40px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;gap:8px}
.tool{height:52px;padding:0 16px;border-radius:14px;background:var(--paper);font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tool.listen{background:var(--leaf-soft);color:var(--leaf)}
.tool.listen.off{background:var(--paper);color:var(--muted)}
.tool.home{background:var(--ink);color:#fff}
.tool.reset{background:var(--accent-soft);color:#9C431B}

/* 가운데 */
main{position:relative;padding:28px 40px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:70px;flex-shrink:0}
.qrow>div:first-child{min-width:0}
.q{font-family:var(--display);font-weight:400;font-size:56px;line-height:1.15;margin:0;white-space:nowrap}
.sub{font-size:22px;color:var(--muted);margin:6px 0 0;font-weight:500}
.say{font-family:var(--display);font-size:40px;line-height:1.2;color:var(--leaf);min-height:48px}
.say.try{color:var(--berry)}
.qrow .say{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.88)}to{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.choice{background:var(--card);border:4px solid var(--line);border-radius:28px;font-family:var(--display);display:grid;place-items:center;transition:transform .12s,border-color .12s,background .12s,opacity .2s;box-shadow:0 6px 0 var(--line)}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.choice.yes{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:0 6px 0 var(--leaf)}
.choice.no{opacity:.35;pointer-events:none;box-shadow:none}
.choice.pick{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 6px 0 var(--accent)}

/* 날짜 */
.dateWrap{display:grid;grid-template-columns:390px 350px minmax(0,1fr);gap:18px;height:100%;align-items:center}
.monthCalendar{background:#fff;border:3px solid #DCE6DD;border-radius:26px;padding:20px;box-shadow:0 8px 0 #D5DED6;box-sizing:border-box}
.monthCalendar h2{font:400 35px var(--display);margin:0 0 8px;text-align:center}
.calendarGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.calendarGrid span{display:grid;place-items:center;min-height:40px;font-size:20px;font-weight:700;border-radius:10px}
.calendarGrid .weekName{color:var(--muted);font-size:16px;min-height:30px}
.calendarGrid .sunday{color:var(--berry)}.calendarGrid .saturday{color:var(--sky)}
.ilryeok{background:var(--card);border-radius:20px;box-shadow:0 10px 0 var(--line);overflow:hidden;text-align:center;position:relative}
.ilryeok .rings{position:absolute;top:-10px;left:0;right:0;display:flex;justify-content:space-around;padding:0 70px}
.ilryeok .rings span{width:22px;height:38px;border-radius:11px;background:var(--ink)}
.ilryeok .head{background:var(--berry);color:#fff;font-family:var(--display);font-size:40px;padding:36px 0 14px}
.ilryeok .num{font-family:var(--display);font-size:200px;line-height:1.05;padding:10px 0 24px;font-variant-numeric:tabular-nums}
.ilryeok .wd{font-family:var(--display);font-size:40px;padding:0 0 28px;color:var(--muted)}
.ilryeok .unk{color:var(--no)}
.dateQ{display:flex;flex-direction:column;gap:24px}
.row3{display:flex;gap:24px}
.row3 .choice{width:230px;height:170px;font-size:76px}
.qtag{display:inline-block;font-size:22px;font-weight:700;background:var(--accent-soft);color:#AE4D1F;padding:6px 16px;border-radius:14px;margin-bottom:14px}
.dateWrap{gap:18px}
.dateWrap .ilryeok{border:3px solid #E5D9DC;border-radius:30px;box-shadow:0 12px 0 #D5DED6}
.dateWrap .ilryeok .head{background:linear-gradient(120deg,#DE4870,#F2746B)}
.dateWrap .ilryeok .wd{color:var(--leaf)}
.dateQ{gap:20px;padding:26px 24px;background:#fff;border:3px solid #DCE6DD;border-radius:30px;box-shadow:0 10px 0 #D5DED6}
.dateQ .q{font-size:40px;white-space:normal}
.dateQ .row3{gap:16px}
.dateQ .row3 .choice{flex:1;min-width:0;width:auto;height:120px;font-size:48px;border-radius:24px}
.dateQ .say{min-height:50px}

/* 요일 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:18px;margin-top:28px}
.week .choice{height:230px;font-size:100px;align-content:center;gap:0}
.week .choice span{line-height:1.1}
.week .choice small{font-family:var(--body);font-size:22px;font-weight:700;color:var(--muted)}
.c-sun{color:var(--berry)}.c-sat{color:var(--sky)}
.strip{display:flex;gap:16px;margin-top:30px;font-family:var(--display);font-size:36px;align-items:center;min-height:62px}
.strip span{padding:10px 24px;border-radius:18px;background:var(--card)}
.strip .t{background:var(--ink);color:#fff}

/* 날씨 */
.wGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-top:20px}
.wGrid .choice{height:210px;font-size:34px;align-content:center;gap:6px;white-space:nowrap}
.wGrid svg{width:116px;height:116px}
.fGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
.fGrid .choice{height:96px;font-size:38px;grid-auto-flow:column;gap:14px;white-space:nowrap}
.therm{width:22px;height:60px;border-radius:11px;background:var(--paper);position:relative;overflow:hidden;border:3px solid var(--ink)}
.therm b{position:absolute;left:0;right:0;bottom:0}
.wSay{margin-top:22px;font-size:34px}

/* 출석 */
.count{font-family:var(--display);font-size:38px;text-align:right;white-space:nowrap;line-height:1.1}
.count em{font-style:normal;color:var(--leaf);font-size:60px}
.count small{display:block;font-family:var(--body);font-size:20px;color:var(--muted);font-weight:500}
.kids{display:grid;gap:18px;margin-top:20px}
.kid{background:var(--card);border:4px solid var(--line);border-radius:24px;font-family:var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 var(--line);overflow:hidden;min-width:0;line-height:1.1}
.kid .nm{white-space:nowrap}
.kid .st{font-family:var(--body);font-weight:900;font-size:18px;padding:3px 12px;border-radius:12px;background:var(--paper);color:var(--muted)}
.kid.in{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:0 6px 0 var(--leaf)}
.kid.in .st{background:var(--leaf);color:#fff}
.kid.out{border-style:dashed;color:var(--muted);background:var(--paper)}
.kid.out .st{background:var(--no);color:#fff}

/* 기분 */
.mBoard{display:grid;gap:12px;margin-top:12px;height:330px;flex-shrink:0}
.mk{background:var(--card);border:4px solid var(--line);border-radius:24px;display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;min-width:0;padding:6px;box-shadow:0 5px 0 var(--line)}
.mk.v{flex-direction:column;gap:6px}
.mk.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 5px 0 var(--accent)}
.mk .fc{flex-shrink:0;display:grid;place-items:center;border-radius:50%}
.mk .fc svg{width:100%;height:100%}
.mk .fc.empty{border:4px dashed var(--no);font-family:var(--display);color:var(--no)}
.mk .tx{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.mk .nm{font-family:var(--display);white-space:nowrap;line-height:1.1}
.mk .mw{font-weight:700;color:var(--muted);white-space:nowrap}
.mFaces{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:18px;height:130px;flex-shrink:0}
.mFaces .choice{border-radius:22px;align-content:center;gap:2px;font-size:28px;white-space:nowrap}
.mFaces svg{width:76px;height:76px}
.mFaces.off .choice{opacity:.4;pointer-events:none}

/* 일과 */
.slots{display:flex;gap:12px;margin-top:14px;height:140px;flex-shrink:0}
.slot{flex:1;min-width:0;background:var(--card);border:4px solid var(--line);border-radius:22px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 var(--line)}
.slot .n{font-size:20px;font-weight:900;color:var(--muted);white-space:nowrap}
.slot .ic{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center}
.slot .ic svg{width:44px;height:44px}
.slot .ic.empty{border:4px dashed var(--no);border-radius:50%;font-family:var(--display);font-size:40px;color:var(--no)}
.slot .s{font-family:var(--display);font-size:20px;text-align:center;line-height:1.1;word-break:keep-all;overflow-wrap:anywhere;max-height:44px;overflow:hidden}
.slot.lunch{background:var(--accent-soft);border-color:#F6B48C;box-shadow:0 5px 0 #F6B48C}
.slot.full{border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf)}
.slot.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 5px 0 var(--accent);transform:translateY(-4px)}
.palLab{font-size:20px;font-weight:700;color:var(--muted);margin:20px 0 8px;flex-shrink:0}
.pal{display:grid;gap:12px;flex:none;height:180px;box-sizing:border-box;min-height:0;overflow-y:auto;align-content:start;padding:2px 4px 8px}
.pal .choice{grid-auto-flow:column;justify-content:start;gap:12px;padding:0 14px;border-radius:20px;font-size:28px;text-align:left;line-height:1.1;word-break:keep-all;min-width:0;overflow:hidden}
.pal svg{width:56px;height:56px}
.pal .choice.no{opacity:.3}
.pal.off .choice{opacity:.4;pointer-events:none}
.mini-btn{height:46px;padding:0 18px;border-radius:14px;background:var(--card);border:3px solid var(--line);font-size:18px;font-weight:700;white-space:nowrap}
.dismiss{display:flex;align-items:center;gap:10px;margin-top:13px;flex-shrink:0}
.dismiss b{font-size:21px;white-space:nowrap;margin-right:4px}
.dismiss button{height:52px;flex:1;min-width:0;padding:0 8px;border:3px solid var(--line);border-radius:15px;background:var(--card);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.dismiss button span:last-child{font-variant-numeric:tabular-nums}
.dismiss button.pick{border-color:var(--accent);background:var(--accent-soft);color:#8E3E17}
.eventRow{display:flex;align-items:center;gap:14px;margin-top:12px;flex-shrink:0}
.eventRow label{font-size:21px;font-weight:900;white-space:nowrap}
.eventRow input{box-sizing:border-box;flex:1;min-width:0;height:54px;padding:0 16px;border:3px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font:700 21px var(--body)}
.eventRow input::placeholder{color:var(--muted);font-weight:500}
.eventRow button{height:54px;padding:0 18px;border-radius:15px;background:var(--ink);color:#fff;font-size:20px;font-weight:900;white-space:nowrap}
.eventGuide{white-space:normal;text-align:center;overflow-wrap:anywhere;line-height:1.25}
.eventSummary{margin:16px 0;font-size:23px;line-height:1.35;overflow-wrap:anywhere}
.eventSummary b{display:block;color:#BFE8CE;font-size:18px}
.tool.fullscreen{width:52px;padding:0;justify-content:center}.tool.fullscreen svg{width:26px;height:26px}
.rest{margin-top:60px;font-family:var(--display);font-size:56px;text-align:center}

/* 급식 */
.mealWeek{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px;flex-shrink:0}
.mealDay{height:86px;min-width:0;padding:9px 12px;border:3px solid var(--line);border-radius:19px;background:var(--card);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;text-align:left;box-shadow:0 4px 0 var(--line)}
.mealDay strong{font-family:var(--display);font-size:27px;font-weight:400;white-space:nowrap}
.mealDay small{font-size:16px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mealDay.pick{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 0 var(--accent)}
.tray{display:grid;gap:16px;margin-top:20px}
.dish{background:var(--card);border:4px solid var(--line);border-radius:24px;padding:12px 16px;display:flex;gap:14px;align-items:center;text-align:left;box-shadow:0 5px 0 var(--line);min-width:0;overflow:hidden}
.dish svg{flex-shrink:0}
.dish .tx{min-width:0}
.dish b{font-family:var(--display);font-weight:400;line-height:1.1;display:block;word-break:keep-all;overflow-wrap:anywhere}
.al{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
.al span{font-weight:700;padding:1px 8px;border-radius:9px;background:var(--paper);color:var(--muted);white-space:nowrap}
.dish.seen{border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf)}

/* 급식 이름 따라 쓰기: 메뉴를 누르면 한 가지씩 크게 연습 */
.writingOverlay{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:rgba(30,41,68,.58)}
.writingPanel{width:1300px;height:730px;box-sizing:border-box;padding:26px 34px 30px;display:flex;flex-direction:column;gap:18px;border-radius:30px;background:var(--card);box-shadow:0 22px 60px rgba(30,41,68,.25)}
.writingHead{display:flex;align-items:center;gap:20px;min-height:72px}
.writingHead h2{font:400 52px/1.1 var(--display);margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.writingHead button,.writingActions button{height:64px;padding:0 26px;border-radius:18px;font:700 24px var(--body);background:var(--paper)}
.writingPanel p{margin:0;color:var(--muted);font-size:25px;font-weight:700}
.writingSurface{position:relative;flex:1;min-height:0;border:4px solid #BFD1C4;border-radius:26px;background:linear-gradient(transparent 49%,#E2EBE4 49.5%,#E2EBE4 50.5%,transparent 51%),#F8FBF8;overflow:hidden}
.writingGuide{position:absolute;inset:0 24px;display:grid;place-items:center;white-space:nowrap;color:#AFBDB2;font-family:var(--display);pointer-events:none}
.writingCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.writingActions{display:flex;gap:16px;justify-content:flex-end}
.writingActions .nextDish{background:var(--ink);color:#fff}

/* 정리 */
.sum{display:grid;grid-template-columns:360px 1fr 340px;gap:16px;margin-top:16px;flex:1;min-height:0}
.box{background:var(--card);border-radius:22px;padding:16px 22px;border:3px solid var(--line);min-width:0;overflow:hidden}
.box h3{margin:0 0 6px;font-size:19px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.box p{margin:0;font-family:var(--display);font-size:34px;line-height:1.2}
.box p.two{font-size:28px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.big{background:var(--ink);color:#fff;border-color:var(--ink);display:flex;flex-direction:column;justify-content:space-between}
.big h3{color:#AFC0DA}
.big p{font-size:56px}
.big p.cheer{font-family:var(--display);font-size:34px;color:var(--sun);line-height:1.2}
.big .homeTime{color:#fff;font-size:31px}
.mid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:124px minmax(0,1fr) 120px;gap:16px;min-height:0}
.mid .wide{grid-column:span 2}
.mid .box:last-child{padding:11px 18px}
.mid .box:last-child p.two{font-size:25px;line-height:1.15;-webkit-line-clamp:2}
.todayLessons{display:flex;flex-direction:column;padding:10px 16px}
.todayLessons h3{display:flex;align-items:center;justify-content:space-between;gap:12px}
.todayLessons h3 small{font-size:16px;font-weight:700;color:var(--leaf);letter-spacing:0}
.lessonList{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(40px,1fr);gap:6px;flex:1;min-height:0;overflow:auto}
.lesson{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 9px;border-radius:13px;background:var(--paper);font-family:var(--display);font-size:23px;line-height:1.1}
.lesson.chosen{background:var(--leaf-soft);box-shadow:inset 0 0 0 2px var(--leaf)}
.lesson b{font-family:var(--body);font-size:16px;white-space:nowrap}
.lesson span{min-width:0;overflow-wrap:anywhere}
.lesson em{margin-left:auto;color:var(--leaf);font-style:normal;font-size:22px}
.mid .wx{display:flex;align-items:center;gap:6px;font-size:24px;line-height:1.15}
.wx svg{width:46px;height:46px;flex-shrink:0}
.wx span{min-width:0;word-break:keep-all}
.sum>.box:last-child{overflow-y:auto}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.mlist>div{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:26px;min-width:0}
.mlist svg{width:46px;height:46px;flex-shrink:0}
.mlist .mt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.mlist small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:500;line-height:1.3;word-break:keep-all}
.teacherSummary{display:flex;align-items:center;gap:8px;margin:6px 0 12px;padding:7px 9px;border-radius:13px;background:var(--leaf-soft);font-family:var(--display);font-size:23px}
.teacherSummary svg{width:40px;height:40px;flex-shrink:0}

/* 아래 */
.bot{display:flex;align-items:center;gap:12px;padding:0 28px;border-top:3px solid var(--line);background:var(--card)}
.nav{flex-shrink:0;white-space:nowrap;height:76px;padding:0 24px;border-radius:22px;font-family:var(--display);font-size:34px;display:flex;align-items:center;gap:10px}
.nav.prev{background:var(--paper)}
.nav.next{background:var(--accent);color:#fff;box-shadow:0 6px 0 #C2561A}
.nav.next:active{transform:translateY(4px);box-shadow:0 2px 0 #C2561A}
.nav:disabled{opacity:.3;cursor:default}
.nav svg{width:28px;height:28px}
.steps{display:flex;gap:2px;flex:1;justify-content:center;align-items:center;min-width:0}
.chip{display:flex;align-items:center;gap:7px;height:56px;padding:0 12px 0 6px;border-radius:28px;font-family:var(--display);font-size:23px;color:var(--muted);white-space:nowrap;flex-shrink:0;line-height:1}
.chip i{font-style:normal;width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--paper);color:var(--muted)}
.chip.done i{background:var(--leaf);color:#fff}
.chip.now{background:var(--ink);color:#fff}
.chip.now i{background:var(--accent);color:#fff}
.steps .sep{width:6px;height:3px;border-radius:2px;background:var(--line);flex-shrink:0}

.btn{height:56px;padding:0 24px;border-radius:16px;font-size:19px;font-weight:700;background:var(--paper);white-space:nowrap}

.transferPanel .transferActions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:22px;font-weight:700;padding:14px 28px;border-radius:20px;z-index:9;white-space:nowrap}

/* 선생님용 시간표 입력 표 */
.schedOpen{width:100%;height:58px;border-radius:16px;background:var(--ink);color:#fff;font-size:20px;font-weight:700}

.schedPanel{width:1320px;height:750px;background:#fff;border-radius:28px;display:grid;grid-template-rows:78px minmax(0,1fr) 82px;overflow:hidden;box-shadow:0 18px 50px rgba(30,41,68,.22)}

.schedTable td{padding:0}
.schedTable input{box-sizing:border-box;width:100%;height:64px;padding:0 12px;border:3px solid var(--line);border-radius:14px;background:#F8FBF8;color:var(--ink);font:700 21px var(--body);text-align:center}
.schedTable input::placeholder{font-weight:500;color:#829087}

.schedPanel footer{border-top:2px solid var(--line)}
.schedPanel footer p{flex:1;font-size:18px;color:var(--muted);font-weight:700}

/* 좁은 창에서는 칠판을 축소하지 않고 내용과 버튼을 다시 배치한다. */

<body>

<div id="fit"><div id="stage">
  <header class="top">
    <div class="brand"><b id="cls">햇살반</b><span>아침 열기</span></div>
    <div class="today" id="hint"></div>
    <div class="clock" id="clock">9:00</div>
    <div class="tools">
      <button class="tool home" id="homeBtn" title="첫 화면으로 이동해요. 오늘 기록은 남아요.">처음으로</button>
      <button class="tool reset" id="resetBtn">오늘 다시 시작</button>
      <button class="tool listen" id="voiceBtn" type="button" aria-pressed="true">음성 켜짐</button>
      <button class="tool" id="shareBtn">공유</button>
      <button class="tool" id="tBtn">선생님</button>
      <button class="tool fullscreen" id="fsBtn" type="button" aria-label="전체 화면" title="전체 화면"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 4H4v8M20 4h8v8M4 20v8h8M28 20v8h-8"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
  <footer class="bot">
    <button class="nav prev" id="prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>이전</button>
    <nav class="steps" id="steps" aria-label="아침 열기 단계"></nav>
    <button class="nav next" id="next">다음<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
  <div class="sheet" id="sheet" hidden></div>
</div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['일','월','화','수','목','금','토'];
const ALLERGY={1:'난류',2:'우유',3:'메밀',4:'땅콩',5:'대두',6:'밀',7:'고등어',8:'게',9:'새우',10:'돼지고기',11:'복숭아',12:'토마토',13:'아황산류',14:'호두',15:'닭고기',16:'쇠고기',17:'오징어',18:'조개류',19:'잣'};
const STEP_DEF=[
  {id:'date',label:'날짜'},{id:'day',label:'요일'},{id:'weather',label:'날씨'},
  {id:'att',label:'출석'},{id:'mood',label:'기분'},{id:'plan',label:'일과'},
  {id:'lunch',label:'급식'},{id:'sum',label:'정리'}];
const MAIN_W=1360; /* 가운데 활동 영역 안쪽 너비 */

/* ---------- 저장 ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEFAULTS={
  cls:'햇살반',
  kids:['학생 1','학생 2','학생 3','학생 4'],
  plan:{1:'국어, 수학, 진로와 직업, 체육, 점심, 미술, 미술',
        2:'수학, 국어, 음악, 진로와 직업, 점심, 사회, 창체',
        3:'국어, 체육, 수학, 과학, 점심, 생활, 생활',
        4:'진로와 직업, 진로와 직업, 국어, 음악, 점심, 수학, 체육',
        5:'수학, 국어, 미술, 미술, 점심, 창체'},
  planCheck:true,
  lunch:'',
  mealMode:'auto',
  school:null,
  steps:{date:true,day:true,weather:true,att:true,mood:true,plan:true,lunch:true,sum:true},
  sample:false
};
let S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),store.get('morning:settings',{}));
S.steps=Object.assign({},DEFAULTS.steps,S.steps||{});S.steps.sum=true;
delete S.subjects;if(S.planCheck===undefined)S.planCheck=true;

const shared=new URLSearchParams(location.search);
if(/^\d{7,10}$/.test(shared.get('school')||'')&&/^[A-Z][0-9]{2}$/.test(shared.get('office')||'')){
  S.school={code:shared.get('school'),office:shared.get('office'),name:(shared.get('name')||'공유된 학교').slice(0,80),addr:(shared.get('address')||'').slice(0,120)};
  S.mealMode='auto';store.set('morning:settings',S);
  history.replaceState(null,'',location.pathname);
}
const now=new Date();
const T={y:now.getFullYear(),m:now.getMonth()+1,d:now.getDate(),w:now.getDay()};
const dayKey='morning:day:'+T.y+'-'+T.m+'-'+T.d;
const blankDay=()=>({att:{},mood:{},teacherMood:null,weather:[],feel:null,dateOk:{m:false,d:false},dayOk:false,pick:{},dismissal:null,event:'',eventWriting:{name:'',paths:[]},dishes:{},writing:{}});
let D=Object.assign(blankDay(),store.get(dayKey,{}));if(!D.pick)D.pick={};if(!D.writing)D.writing={};
if(!Array.isArray(D.weather))D.weather=D.weather?[D.weather]:[];
if(typeof D.event!=='string')D.event='';
if(!D.eventWriting||!Array.isArray(D.eventWriting.paths))D.eventWriting={name:'',paths:[]};
if(![5,6,7].includes(D.dismissal))D.dismissal=null;
function saveDay(){store.set(dayKey,D)}

let steps=[],cur=0,sel=null,slotSel=null;
function buildSteps(){steps=STEP_DEF.filter(s=>S.steps[s.id]);if(cur>=steps.length)cur=steps.length-1}

let lastSay='';

const cleanNeis=l=>String(l).replace(/[#*]/g,'').replace(/\((?![\d.,\s]+\))[^)]{1,2}\)/g,'').replace(/[@-].*$/,'').replace(/\s{2,}/g,' ').trim();
/* 나이스 교육정보 개방 포털 Open API */
async function neis(service,params){
  const q=new URLSearchParams(params);
  const res=await fetch(`https://morning-board-classroom-2026.zxc3285.chatgpt.site/api/${service}?${q}`,{headers:{Accept:'application/json'}});
  const j=await res.json();
  if(!res.ok)throw new Error(j.error||'학교 정보를 가져오지 못했어요');
  return j.rows||[];
}
let mealByDate={};
async function loadMeal(dateKey=ymd){
  if(S.mealMode!=='auto'||!S.school)return;
  if(mealByDate[dateKey])return;
  const school=S.school,key=`morning:meal:v2:${school.code}:${dateKey}`,hit=store.get(key,null);
  if(hit&&hit.state==='ok'&&Date.now()-hit.savedAt<2*60*60*1000){mealByDate[dateKey]=hit;refreshLunch();return}
  const d=new Date(Number(dateKey.slice(0,4)),Number(dateKey.slice(4,6))-1,Number(dateKey.slice(6,8)));
  if(d.getDay()===0||d.getDay()===6){mealByDate[dateKey]={state:'noday',lines:[]};refreshLunch();return}
  mealByDate[dateKey]={state:'loading',lines:[]};refreshLunch();
  try{
    const rows=await neis('mealServiceDietInfo',{ATPT_OFCDC_SC_CODE:school.office,SD_SCHUL_CODE:school.code,MLSV_YMD:dateKey});
    if(S.school?.code!==school.code)return;
    const r=rows.find(x=>x.MMEAL_SC_NM==='중식')||rows[0];
    mealByDate[dateKey]=r?{state:'ok',lines:String(r.DDISH_NM).split(/<br\s*\/?>/i).map(cleanNeis).filter(Boolean)}:{state:'noday',lines:[]};
    if(mealByDate[dateKey].state==='ok')store.set(key,{...mealByDate[dateKey],savedAt:Date.now()});
  }catch(e){if(S.school?.code!==school.code)return;mealByDate[dateKey]={state:'error',lines:[],error:'학교 급식을 불러오지 못했어요. 날짜를 다시 눌러 주세요.'}}
  refreshLunch();
}
function loadWeekMeals(){if(S.mealMode==='auto'&&S.school)weekDates.forEach(day=>loadMeal(day.key))}
function autoMeal(dateKey=ymd){
  if(S.mealMode!=='auto'||!S.school)return null;
  return mealByDate[dateKey]||{state:'loading',lines:[]};
}
const dishes=(dateKey=ymd)=>{const a=autoMeal(dateKey);return(a?a.lines:S.lunch.split('\n')).map(x=>x.trim()).filter(Boolean).map(parseDish).slice(0,12)};

function choices(box,opts,good,onGood,sayEl,label){
  box.innerHTML=opts.map((o,i)=>`<button class="choice" data-i="${i}">${label?label(o):o}</button>`).join('');
  box.onclick=e=>{const b=e.target.closest('.choice');if(!b)return;const o=opts[+b.dataset.i];
    if(o===good){b.classList.add('yes');[...box.children].forEach(x=>x!==b&&x.classList.add('no'));tone(true);onGood(b)}
    else{b.classList.add('no');tone(false);setSay(sayEl,'다시 찾아봐요',false);speak(`${b.querySelector('small')?.textContent||b.textContent.trim()}. 다시 찾아봐요.`)}}}
function markGood(box,good,opts){[...box.children].forEach((x,i)=>x.classList.add(opts[i]===good?'yes':'no'))}

function openEventWriting(){
  $('#writingOverlay')?.remove();
  const name=D.event.trim(),saved=D.eventWriting;
  let paths=saved.name===name?saved.paths:[];
  const overlay=document.createElement('div');overlay.className='writingOverlay';overlay.id='writingOverlay';
  const fontSize=Math.max(30,Math.min(105,Math.floor(780/Math.max(name.length,1))));
  overlay.innerHTML=`<div class="writingPanel" role="dialog" aria-modal="true" aria-label="오늘의 행사 글씨 쓰기">
    <div class="writingHead"><h2>오늘의 행사</h2><button id="writingClose" type="button">닫기</button></div>
    <p>${name?'흐린 글씨를 손가락이나 펜으로 따라 써요.':'행사 이름을 손가락이나 펜으로 써요.'}</p>
    <div class="writingSurface"><span class="writingGuide eventGuide" style="font-size:${fontSize}px">${esc(name)}</span><canvas class="writingCanvas" aria-label="오늘의 행사 글씨 쓰는 자리"></canvas></div>
    <div class="writingActions"><button id="writingClear" type="button">지우고 다시 쓰기</button><button class="nextDish" id="writingDone" type="button">다 썼어요</button></div></div>`;
  $('#stage').appendChild(overlay);
  const canvas=overlay.querySelector('canvas'),dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(canvas.clientWidth*dpr);canvas.height=Math.round(canvas.clientHeight*dpr);
  const save=()=>{D.eventWriting={name,paths};saveDay()};
  const renderInk=()=>{const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#1E2944';ctx.fillStyle='#1E2944';ctx.lineWidth=7*dpr;ctx.lineCap='round';ctx.lineJoin='round';
    paths.forEach(path=>{if(!path.length)return;if(path.length===1){ctx.beginPath();ctx.arc(path[0][0]*canvas.width,path[0][1]*canvas.height,3.5*dpr,0,Math.PI*2);ctx.fill();return}
      ctx.beginPath();path.forEach(([px,py],j)=>j?ctx.lineTo(px*canvas.width,py*canvas.height):ctx.moveTo(px*canvas.width,py*canvas.height));ctx.stroke()})};
  renderInk();let active=null;
  const addPoint=e=>{const rect=canvas.getBoundingClientRect(),point=[Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)),Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height))];
    const prev=active[active.length-1];if(!prev||Math.hypot(point[0]-prev[0],point[1]-prev[1])>.004){active.push(point);renderInk()}};
  canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);active=[];paths.push(active);addPoint(e)};
  canvas.onpointermove=e=>{if(active){e.preventDefault();addPoint(e)}};
  const finish=()=>{if(!active)return;save();active=null};
  canvas.onpointerup=finish;canvas.onpointercancel=finish;
  const close=()=>{finish();overlay.remove();$('#eventWrite')?.focus()};
  overlay.querySelector('#writingClose').onclick=close;
  overlay.querySelector('#writingDone').onclick=()=>{close();speak('잘 썼어요.')};
  overlay.querySelector('#writingClear').onclick=()=>{paths=[];save();renderInk();speak('지우고 다시 써 봐요.')};
  overlay.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}};
  overlay.querySelector('#writingClose').focus();
}

        row.forEach((value,ci)=>{
          if(hasPeriods&&ci===0)return;
          const day=hasHeader?header[ci-(hasPeriods&&header[0]?1:0)]:startDay+ci-(hasPeriods?1:0);
          if(day<1||day>5)return;
          const cell=overlay.querySelector(`[data-day="${day}"][data-period="${period}"]`);
          if(cell){cell.value=value.slice(0,24);count++}
        });
      });
      overlay.querySelector('#scheduleHelp').textContent=count?`${count}칸에 붙여넣었어요. 확인한 뒤 표 적용을 눌러 주세요.`:'붙여넣을 칸을 찾지 못했어요. 월요일 1교시 칸에서 다시 해 주세요.';
    });
    const closeSchedule=()=>{overlay.remove();$('#editSchedule').focus()};
    overlay.querySelector('#scheduleCancel').onclick=closeSchedule;
    overlay.querySelector('#scheduleApply').onclick=()=>{
      days.forEach(w=>{$('#sP'+w).value=Array.from({length:9},(_,i)=>overlay.querySelector(`[data-day="${w}"][data-period="${i}"]`).value.trim()).filter(Boolean).join(', ')});
      closeSchedule();$('#schedSummary').textContent='시간표를 입력했어요. 아래 저장하고 닫기를 눌러 주세요.'};
    overlay.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();closeSchedule()}};
    overlay.querySelector('[data-day="1"][data-period="0"]').focus();
  };
  const close=()=>{sh.hidden=true;sh.innerHTML='';$('#tBtn').focus()};
  let chosen=S.school;
  const settingsFromForm=()=>{
    const kids=uniq($('#sKids').value.split('\n').map(x=>x.trim()).filter(Boolean)).slice(0,18);
    const plan=Object.fromEntries([1,2,3,4,5].map(w=>[w,$('#sP'+w).value.trim()]));
    const steps={sum:true};STEP_DEF.forEach(s=>{if(s.id!=='sum')steps[s.id]=$('#sS_'+s.id).checked});
    const lunch=$('#sLunch').value.trim();
    return{cls:$('#sCls').value.trim()||'우리 반',kids:kids.length?kids:['학생'],plan,planCheck:$('#sCheck').checked,lunch,steps,sample:S.sample&&lunch===DEFAULTS.lunch,mealMode:$('#sMealAuto').checked?'auto':'manual',school:chosen||null};
  };
  $('#exportBtn').onclick=()=>{
    const data={format:'morning-board-settings',version:1,settings:settingsFromForm()};
    const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download='아침열기-설정.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    $('#transferMsg').textContent='설정 파일을 저장했어요. 다른 기기에서 설정 가져오기를 눌러 주세요.';
  };
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=async e=>{
    const file=e.target.files[0];e.target.value='';if(!file)return;
    const msg=$('#transferMsg');
    if(file.size>65536){msg.textContent='설정 파일이 너무 커요. 내보낸 JSON 파일을 골라 주세요.';return}
    let raw;
    try{raw=JSON.parse(await file.text())}catch(err){msg.textContent='파일을 읽지 못했어요. 내보낸 JSON 파일을 골라 주세요.';return}
    const v=raw&&raw.format==='morning-board-settings'&&raw.version===1&&raw.settings;
    const valid=v&&typeof v==='object'&&!Array.isArray(v)&&typeof v.cls==='string'&&Array.isArray(v.kids)&&v.kids.length>0&&v.kids.length<=18&&v.kids.every(k=>typeof k==='string'&&k.trim()&&k.length<=50)&&v.plan&&typeof v.plan==='object'&&[1,2,3,4,5].every(w=>typeof v.plan[w]==='string'&&v.plan[w].length<=1000)&&typeof v.planCheck==='boolean'&&typeof v.lunch==='string'&&v.lunch.length<=2000&&['auto','manual'].includes(v.mealMode)&&v.steps&&typeof v.steps==='object'&&(!v.school||(/^\d{7,10}$/.test(v.school.code)&&/^[A-Z][0-9]{2}$/.test(v.school.office)&&typeof v.school.name==='string'));
    if(!valid){msg.textContent='이 파일은 아침 열기 설정 파일이 아니에요.';return}
    const next={cls:v.cls.trim().slice(0,12)||'우리 반',kids:uniq(v.kids.map(k=>k.trim())).slice(0,18),plan:Object.fromEntries([1,2,3,4,5].map(w=>[w,splitList(v.plan[w]).slice(0,9).map(s=>s.slice(0,24)).join(', ')])),planCheck:v.planCheck,lunch:v.lunch.trim(),mealMode:v.mealMode,school:v.school?{code:v.school.code,office:v.school.office,name:v.school.name.slice(0,80),addr:String(v.school.addr||'').slice(0,120)}:null,steps:Object.fromEntries(STEP_DEF.map(s=>[s.id,s.id==='sum'?true:v.steps[s.id]!==false])),sample:v.sample===true};
    const overlay=document.createElement('div');overlay.className='transferOverlay';
    overlay.innerHTML=`<div class="transferPanel" role="dialog" aria-modal="true" aria-label="설정 가져오기 확인"><h3>설정을 가져올까요?</h3><p><b>${esc(next.cls)}</b> · 학생 ${next.kids.length}명${next.school?` · ${esc(next.school.name)}`:''}</p><p>이 기기의 선생님 설정을 바꾸고, 오늘 활동 기록을 새로 시작해요.</p><p>가져온 학생 이름과 시간표는 이 기기에만 저장돼요.</p><div class="transferActions"><button class="btn" id="cancelImport">취소</button><button class="btn main" id="applyImport">설정 가져오기</button></div></div>`;
    sh.appendChild(overlay);
    const cancel=()=>{overlay.remove();$('#importBtn').focus()};
    overlay.querySelector('#cancelImport').onclick=cancel;
    overlay.querySelector('#applyImport').onclick=()=>{S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),next);store.set('morning:settings',S);D=blankDay();saveDay();lunchDate=null;mealByDate={};chosen=S.school;close();applyS();loadMeal();toast('설정을 가져왔어요')};
    overlay.onkeydown=ev=>{if(ev.key==='Escape'){ev.preventDefault();cancel()}};
    overlay.querySelector('#applyImport').focus();
  };
  sh.querySelectorAll('input[name=sMeal]').forEach(r=>r.onchange=()=>{const a=$('#sMealAuto').checked;$('#autoBox').hidden=!a;$('#manBox').hidden=a});
  const showCur=()=>{$('#curSchool').innerHTML=chosen?`<b>${esc(chosen.name)}</b><small>${esc(chosen.addr||'')}</small>`:'<small>아직 정하지 않았어요</small>'};
  const search=async()=>{const q=$('#sQ').value.trim(),msg=$('#reqMsg'),res=$('#reqRes');if(!q){$('#sQ').focus();return}
    msg.textContent='찾고 있어요…';res.innerHTML='';
    let rs;try{rs=await neis('schoolInfo',{SCHUL_NM:q})}catch(e){msg.textContent=e.message;return}
    if(!rs.length){msg.textContent=`‘${q}’ 학교를 찾지 못했어요. 이름을 짧게 줄여서 다시 찾아봐요.`;return}
    msg.textContent=rs.length>=20?'결과가 많아요. 이름을 더 정확히 쓰면 좋아요. 우리 학교를 눌러 골라요.':'우리 학교를 눌러 골라요.';
    res.innerHTML=rs.map((r,i)=>`<button class="btn" data-i="${i}"><b>${esc(r.SCHUL_NM)}</b><small>${esc(r.ORG_RDNMA||r.LCTN_SC_NM||'')}</small></button>`).join('');
    res.onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=rs[+b.dataset.i];
      chosen={office:String(r.ATPT_OFCDC_SC_CODE),code:String(r.SD_SCHUL_CODE),name:String(r.SCHUL_NM),addr:String(r.ORG_RDNMA||'')};showCur();
      [...res.children].forEach(x=>x.classList.toggle('on',x===b))}};
  $('#sGo').onclick=search;
  $('#sQ').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};
  $('#xBtn').onclick=close;
  let arm=false;
  $('#rBtn').onclick=e=>{if(!arm){arm=true;e.target.classList.add('arm');e.target.textContent='한 번 더 누르면 지워져요';return}
    D=blankDay();saveDay();lunchDate=null;sel=null;slotSel=null;close();go(0,false);toast('오늘 기록을 지웠어요')};
  $('#dBtn').onclick=()=>{S=JSON.parse(JSON.stringify(DEFAULTS));store.set('morning:settings',S);lunchDate=null;mealByDate={};close();applyS(true);loadMeal();toast('예시 설정으로 되돌렸어요')};
  $('#okBtn').onclick=()=>{
    const next=settingsFromForm();
    const planChanged=[1,2,3,4,5].some(w=>next.plan[w]!==S.plan[w]);
    const mealChanged=next.lunch!==S.lunch||next.mealMode!==S.mealMode||(next.school&&next.school.code)!==(S.school&&S.school.code);
    if(planChanged)D.pick={};if(mealChanged){D.dishes={};D.writing={};lunchDate=null;mealByDate={}};saveDay();
    S=Object.assign(S,next);
    store.set('morning:settings',S);close();applyS();loadMeal();
    toast(next.mealMode==='auto'&&!chosen?'저장했어요. 학교를 고르면 급식이 나와요':'저장했어요')};
  setTimeout(()=>$('#sCls').focus(),50);
};
function refreshLunch(){if(!steps.length)return;paintSteps();if($('#writingOverlay'))return;if(steps[cur]&&(steps[cur].id==='lunch'||steps[cur].id==='sum')&&$('#sheet').hidden)go(cur,false)}
function setCls(){const c=$('#cls');c.textContent=S.cls;c.style.fontSize=Math.max(20,Math.min(34,Math.floor(250/Math.max(S.cls.length*.95,1))))+'px'}
function applyS(){setCls();const id=steps[cur]&&steps[cur].id;buildSteps();slotSel=null;sel=null;const j=steps.findIndex(s=>s.id===id);go(j<0?0:j,false)}

/* ---------- 화면 맞추기 · 시계 ---------- */
function fit(){const f=$('#fit'),w=f.clientWidth,h=f.clientHeight;if(!w||!h)return;const st=$('#stage');if(w<=1100){st.style.transform='';st.style.left='';st.style.top='';return}const s=Math.min(w/1440,h/810);
  st.style.transform=`scale(${s})`;st.style.left=((w-1440*s)/2)+'px';st.style.top=((h-810*s)/2)+'px'}
addEventListener('resize',fit);
function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes();$('#clock').textContent=(h<12?'오전 ':'오후 ')+(h%12||12)+':'+String(m).padStart(2,'0')}
setInterval(()=>{tick();const d=new Date();if(d.getFullYear()!==T.y||d.getMonth()+1!==T.m||d.getDate()!==T.d)location.reload()},10000);tick();
setCls();buildSteps();fit();go(0,false);
loadMeal();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(steps[cur])go(cur,false)});
})();
</script>
</body>
</html>

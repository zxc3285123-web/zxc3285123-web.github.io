<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아침 열기 칠판 · 학교 급식 자동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 1440×810 교실 칠판 한 장을 화면에 맞춰 통째로 키움. 위: 반 이름·지금 단계·도구 / 가운데: 활동 / 아래: 이전·단계 띠·다음 */
:root{
  color-scheme: light;
  --paper:#EDF3EE;
  --card:#FFFFFF;
  --ink:#1E2944;
  --muted:#5D6A7C;
  --line:#D3DED6;
  --accent:#F2732B;
  --accent-soft:#FFE6D6;
  --sun:#FFC63A;
  --sky:#3F8FDE;
  --berry:#DE4870;
  --leaf:#2E9B66;
  --leaf-soft:#DDF3E7;
  --no:#B9C2CC;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#fit{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;display:grid;grid-template-rows:96px 610px 104px;background:var(--paper);overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 위 띠 */
.top{display:flex;align-items:center;gap:24px;padding:0 32px;border-bottom:3px solid var(--line);background:var(--card)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:150px;max-width:260px}
.brand b{font-family:var(--display);font-size:34px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:16px;color:var(--muted);font-weight:500}
.today{flex:1;min-width:0;font-size:20px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-badge{display:inline-flex;align-items:center;gap:12px;padding:6px 18px 6px 7px;border:2px solid #F6CEB5;border-radius:22px;background:#FFF3E9;font-family:var(--display);font-size:30px;color:var(--ink)}
.step-count{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;font-size:25px}
.clock{font-family:var(--display);font-size:40px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;gap:8px}
.tool{height:52px;padding:0 16px;border-radius:14px;background:var(--paper);font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tool.listen{background:var(--leaf-soft);color:var(--leaf)}
.tool.home{background:var(--ink);color:#fff}

/* 가운데 */
main{position:relative;padding:28px 40px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:70px;flex-shrink:0}
.qrow>div:first-child{min-width:0}
.q{font-family:var(--display);font-weight:400;font-size:56px;line-height:1.15;margin:0;white-space:nowrap}
.sub{font-size:22px;color:var(--muted);margin:6px 0 0;font-weight:500}
.say{font-family:var(--display);font-size:40px;line-height:1.2;color:var(--leaf);min-height:48px}
.say.try{color:var(--berry)}
.qrow .say{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.88)}to{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.choice{background:var(--card);border:4px solid var(--line);border-radius:28px;font-family:var(--display);display:grid;place-items:center;transition:transform .12s,border-color .12s,background .12s,opacity .2s;box-shadow:0 6px 0 var(--line)}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.choice.yes{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:0 6px 0 var(--leaf)}
.choice.no{opacity:.35;pointer-events:none;box-shadow:none}
.choice.pick{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 6px 0 var(--accent)}

/* 날짜 */
.dateWrap{display:grid;grid-template-columns:400px 1fr;gap:56px;height:100%;align-items:center}
.ilryeok{background:var(--card);border-radius:20px;box-shadow:0 10px 0 var(--line);overflow:hidden;text-align:center;position:relative}
.ilryeok .rings{position:absolute;top:-10px;left:0;right:0;display:flex;justify-content:space-around;padding:0 70px}
.ilryeok .rings span{width:22px;height:38px;border-radius:11px;background:var(--ink)}
.ilryeok .head{background:var(--berry);color:#fff;font-family:var(--display);font-size:40px;padding:36px 0 14px}
.ilryeok .num{font-family:var(--display);font-size:200px;line-height:1.05;padding:10px 0 0;font-variant-numeric:tabular-nums}
.ilryeok .wd{font-family:var(--display);font-size:40px;padding:0 0 28px;color:var(--muted)}
.ilryeok .unk{color:var(--no)}
.dateQ{display:flex;flex-direction:column;gap:24px}
.row3{display:flex;gap:24px}
.row3 .choice{width:230px;height:170px;font-size:76px}
.qtag{display:inline-block;font-size:22px;font-weight:700;background:var(--accent-soft);color:#AE4D1F;padding:6px 16px;border-radius:14px;margin-bottom:14px}
.dateWrap{grid-template-columns:400px 1fr;gap:42px}
.dateWrap .ilryeok{border:3px solid #E5D9DC;border-radius:30px;box-shadow:0 12px 0 #D5DED6}
.dateWrap .ilryeok .head{background:linear-gradient(120deg,#DE4870,#F2746B)}
.dateWrap .ilryeok .wd{color:var(--leaf)}
.dateQ{gap:26px;padding:34px 36px;background:#fff;border:3px solid #DCE6DD;border-radius:30px;box-shadow:0 10px 0 #D5DED6}
.dateQ .q{font-size:52px}
.dateQ .row3{gap:16px}
.dateQ .row3 .choice{flex:1;min-width:0;width:auto;height:154px;font-size:68px;border-radius:24px}
.dateQ .say{min-height:50px}

/* 요일 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:18px;margin-top:28px}
.week .choice{height:230px;font-size:100px;align-content:center;gap:0}
.week .choice span{line-height:1.1}
.week .choice small{font-family:var(--body);font-size:22px;font-weight:700;color:var(--muted)}
.c-sun{color:var(--berry)}.c-sat{color:var(--sky)}
.strip{display:flex;gap:16px;margin-top:30px;font-family:var(--display);font-size:36px;align-items:center;min-height:62px}
.strip span{padding:10px 24px;border-radius:18px;background:var(--card)}
.strip .t{background:var(--ink);color:#fff}

/* 날씨 */
.wGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-top:20px}
.wGrid .choice{height:210px;font-size:34px;align-content:center;gap:6px;white-space:nowrap}
.wGrid svg{width:116px;height:116px}
.fGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
.fGrid .choice{height:96px;font-size:38px;grid-auto-flow:column;gap:14px;white-space:nowrap}
.therm{width:22px;height:60px;border-radius:11px;background:var(--paper);position:relative;overflow:hidden;border:3px solid var(--ink)}
.therm b{position:absolute;left:0;right:0;bottom:0}
.wSay{margin-top:22px;font-size:34px}

/* 출석 */
.count{font-family:var(--display);font-size:38px;text-align:right;white-space:nowrap;line-height:1.1}
.count em{font-style:normal;color:var(--leaf);font-size:60px}
.count small{display:block;font-family:var(--body);font-size:20px;color:var(--muted);font-weight:500}
.kids{display:grid;gap:18px;margin-top:20px}
.kid{background:var(--card);border:4px solid var(--line);border-radius:24px;font-family:var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 var(--line);overflow:hidden;min-width:0;line-height:1.1}
.kid .nm{white-space:nowrap}
.kid .st{font-family:var(--body);font-weight:900;font-size:18px;padding:3px 12px;border-radius:12px;background:var(--paper);color:var(--muted)}
.kid.in{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:0 6px 0 var(--leaf)}
.kid.in .st{background:var(--leaf);color:#fff}
.kid.out{border-style:dashed;color:var(--muted);background:var(--paper)}
.kid.out .st{background:var(--no);color:#fff}

/* 기분 */
.mBoard{display:grid;gap:12px;margin-top:12px;height:330px;flex-shrink:0}
.mk{background:var(--card);border:4px solid var(--line);border-radius:24px;display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;min-width:0;padding:6px;box-shadow:0 5px 0 var(--line)}
.mk.v{flex-direction:column;gap:6px}
.mk.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 5px 0 var(--accent)}
.mk .fc{flex-shrink:0;display:grid;place-items:center;border-radius:50%}
.mk .fc svg{width:100%;height:100%}
.mk .fc.empty{border:4px dashed var(--no);font-family:var(--display);color:var(--no)}
.mk .tx{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.mk .nm{font-family:var(--display);white-space:nowrap;line-height:1.1}
.mk .mw{font-weight:700;color:var(--muted);white-space:nowrap}
.mFaces{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:18px;height:130px;flex-shrink:0}
.mFaces .choice{border-radius:22px;align-content:center;gap:2px;font-size:28px;white-space:nowrap}
.mFaces svg{width:76px;height:76px}
.mFaces.off .choice{opacity:.4;pointer-events:none}

/* 일과 */
.slots{display:flex;gap:12px;margin-top:14px;height:206px;flex-shrink:0}
.slot{flex:1;min-width:0;background:var(--card);border:4px solid var(--line);border-radius:22px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--line)}
.slot .n{font-size:20px;font-weight:900;color:var(--muted);white-space:nowrap}
.slot .ic{width:76px;height:76px;flex-shrink:0;display:grid;place-items:center}
.slot .ic svg{width:76px;height:76px}
.slot .ic.empty{border:4px dashed var(--no);border-radius:50%;font-family:var(--display);font-size:40px;color:var(--no)}
.slot .s{font-family:var(--display);font-size:28px;text-align:center;line-height:1.1;word-break:keep-all;overflow-wrap:anywhere;max-height:62px;overflow:hidden}
.slot.lunch{background:var(--accent-soft);border-color:#F6B48C;box-shadow:0 5px 0 #F6B48C}
.slot.full{border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf)}
.slot.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 5px 0 var(--accent);transform:translateY(-4px)}
.palLab{font-size:20px;font-weight:700;color:var(--muted);margin:20px 0 8px;flex-shrink:0}
.pal{display:grid;gap:12px;flex:1;min-height:0;overflow-y:auto;align-content:start;padding:2px 4px 8px}
.pal .choice{grid-auto-flow:column;justify-content:start;gap:12px;padding:0 14px;border-radius:20px;font-size:28px;text-align:left;line-height:1.1;word-break:keep-all;min-width:0;overflow:hidden}
.pal svg{width:56px;height:56px}
.pal .choice.no{opacity:.3}
.pal.off .choice{opacity:.4;pointer-events:none}
.mini-btn{height:46px;padding:0 18px;border-radius:14px;background:var(--card);border:3px solid var(--line);font-size:18px;font-weight:700;white-space:nowrap}
.rest{margin-top:60px;font-family:var(--display);font-size:56px;text-align:center}

/* 급식 */
.tray{display:grid;gap:16px;margin-top:20px}
.dish{background:var(--card);border:4px solid var(--line);border-radius:24px;padding:12px 16px;display:flex;gap:14px;align-items:center;text-align:left;box-shadow:0 5px 0 var(--line);min-width:0;overflow:hidden}
.dish svg{flex-shrink:0}
.dish .tx{min-width:0}
.dish b{font-family:var(--display);font-weight:400;line-height:1.1;display:block;word-break:keep-all;overflow-wrap:anywhere}
.al{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
.al span{font-weight:700;padding:1px 8px;border-radius:9px;background:var(--paper);color:var(--muted);white-space:nowrap}
.dish.seen{border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf)}

/* 급식 이름 따라 쓰기: 메뉴를 누르면 한 가지씩 크게 연습 */
.writingOverlay{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:rgba(30,41,68,.58)}
.writingPanel{width:1300px;height:730px;box-sizing:border-box;padding:26px 34px 30px;display:flex;flex-direction:column;gap:18px;border-radius:30px;background:var(--card);box-shadow:0 22px 60px rgba(30,41,68,.25)}
.writingHead{display:flex;align-items:center;gap:20px;min-height:72px}
.writingHead h2{font:400 52px/1.1 var(--display);margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.writingHead button,.writingActions button{height:64px;padding:0 26px;border-radius:18px;font:700 24px var(--body);background:var(--paper)}
.writingPanel p{margin:0;color:var(--muted);font-size:25px;font-weight:700}
.writingSurface{position:relative;flex:1;min-height:0;border:4px solid #BFD1C4;border-radius:26px;background:linear-gradient(transparent 49%,#E2EBE4 49.5%,#E2EBE4 50.5%,transparent 51%),#F8FBF8;overflow:hidden}
.writingGuide{position:absolute;inset:0 24px;display:grid;place-items:center;white-space:nowrap;color:#AFBDB2;font-family:var(--display);pointer-events:none}
.writingCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.writingActions{display:flex;gap:16px;justify-content:flex-end}
.writingActions .nextDish{background:var(--ink);color:#fff}

/* 정리 */
.sum{display:grid;grid-template-columns:360px 1fr 340px;gap:16px;margin-top:16px;flex:1;min-height:0}
.box{background:var(--card);border-radius:22px;padding:16px 22px;border:3px solid var(--line);min-width:0;overflow:hidden}
.box h3{margin:0 0 6px;font-size:19px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.box p{margin:0;font-family:var(--display);font-size:34px;line-height:1.2}
.box p.two{font-size:28px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.big{background:var(--ink);color:#fff;border-color:var(--ink);display:flex;flex-direction:column;justify-content:space-between}
.big h3{color:#AFC0DA}
.big p{font-size:56px}
.big p.cheer{font-family:var(--display);font-size:34px;color:var(--sun);line-height:1.2}
.mid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr;gap:16px;min-height:0}
.mid .wide{grid-column:span 2}
.wx{display:flex;align-items:center;gap:8px}
.wx svg{width:56px;height:56px;flex-shrink:0}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.mlist>div{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:26px;min-width:0}
.mlist svg{width:46px;height:46px;flex-shrink:0}
.mlist .mt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.mlist small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:500;line-height:1.3;word-break:keep-all}

/* 아래 */
.bot{display:flex;align-items:center;gap:12px;padding:0 28px;border-top:3px solid var(--line);background:var(--card)}
.nav{flex-shrink:0;white-space:nowrap;height:76px;padding:0 24px;border-radius:22px;font-family:var(--display);font-size:34px;display:flex;align-items:center;gap:10px}
.nav.prev{background:var(--paper)}
.nav.next{background:var(--accent);color:#fff;box-shadow:0 6px 0 #C2561A}
.nav.next:active{transform:translateY(4px);box-shadow:0 2px 0 #C2561A}
.nav:disabled{opacity:.3;cursor:default}
.nav svg{width:28px;height:28px}
.steps{display:flex;gap:2px;flex:1;justify-content:center;align-items:center;min-width:0}
.chip{display:flex;align-items:center;gap:7px;height:56px;padding:0 12px 0 6px;border-radius:28px;font-family:var(--display);font-size:23px;color:var(--muted);white-space:nowrap;flex-shrink:0;line-height:1}
.chip i{font-style:normal;width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--paper);color:var(--muted)}
.chip.done i{background:var(--leaf);color:#fff}
.chip.now{background:var(--ink);color:#fff}
.chip.now i{background:var(--accent);color:#fff}
.steps .sep{width:6px;height:3px;border-radius:2px;background:var(--line);flex-shrink:0}

/* 선생님 설정 */
.sheet{position:absolute;inset:0;background:rgba(30,41,68,.45);display:grid;place-items:center;z-index:5}
.panel{width:1300px;height:740px;background:var(--card);border-radius:28px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:2px solid var(--line)}
.panel header h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px}
.pbody{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:28px;padding:18px 32px;overflow:auto}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label,.f .lab{font-size:18px;font-weight:700}
.f small{font-size:15px;color:var(--muted);line-height:1.4}
.f input[type=text],.f textarea{font:500 18px/1.5 var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:7px 12px;resize:none;width:100%;box-sizing:border-box}
.wk{display:grid;grid-template-columns:32px 1fr;gap:6px 8px;align-items:center}
.wk span{font-family:var(--display);font-size:22px;text-align:center}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checks.one{grid-template-columns:1fr}
.checks label{font-size:17px;font-weight:500;display:flex;gap:8px;align-items:center}
.checks input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0}
.panel footer{display:flex;gap:12px;align-items:center;padding:14px 32px;border-top:2px solid var(--line)}
.btn{height:56px;padding:0 24px;border-radius:16px;font-size:19px;font-weight:700;background:var(--paper);white-space:nowrap}
.btn.main{background:var(--ink);color:#fff;margin-left:auto}
.btn.warn{color:var(--berry)}
.btn.warn.arm{background:var(--berry);color:#fff}
.seg{display:flex;gap:8px}
.seg label{flex:1;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
.seg input{accent-color:var(--accent);width:20px;height:20px;flex-shrink:0}
.school{background:var(--leaf-soft);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-height:44px;justify-content:center}
.school b{font-size:19px}
.srch{display:flex;gap:8px}
.srch input{flex:1;min-width:0}
.srch .btn{height:46px;background:var(--ink);color:#fff}
.res{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.res .btn{height:auto;padding:8px 12px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:2px;white-space:normal;border:2px solid transparent}
.res .btn small{font-weight:500}
.res .btn.on{border-color:var(--accent);background:var(--accent-soft)}
.adv{margin:4px 0 12px;font-size:16px}
.adv summary{cursor:pointer;color:var(--muted);font-weight:700;padding:4px 0}
.adv .f{margin:8px 0 0}
.pnote{font-size:15px;color:var(--muted);margin:0}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:22px;font-weight:700;padding:14px 28px;border-radius:20px;z-index:9;white-space:nowrap}

/* 선생님용 시간표 입력 표 */
.schedOpen{width:100%;height:58px;border-radius:16px;background:var(--ink);color:#fff;font-size:20px;font-weight:700}
.schedOverlay{position:absolute;inset:0;z-index:6;background:rgba(30,41,68,.58);display:grid;place-items:center}
.schedPanel{width:1320px;height:750px;background:#fff;border-radius:28px;display:grid;grid-template-rows:78px minmax(0,1fr) 82px;overflow:hidden;box-shadow:0 18px 50px rgba(30,41,68,.22)}
.schedPanel header,.schedPanel footer{display:flex;align-items:center;gap:16px;padding:0 30px}
.schedPanel header{border-bottom:2px solid var(--line)}
.schedPanel h2{font:400 36px var(--display);margin:0;flex:1}
.schedPanel header button{height:52px;padding:0 20px;border-radius:14px;background:var(--paper);font-size:19px;font-weight:700}
.schedScroll{overflow:auto;padding:16px 22px}
.schedTable{width:100%;border-collapse:separate;border-spacing:8px;table-layout:fixed}
.schedTable th{font-family:var(--display);font-weight:400;text-align:center}
.schedTable thead th{position:sticky;top:0;z-index:2;height:48px;background:var(--ink);color:#fff;font-size:25px;border-radius:13px}
.schedTable thead th:first-child{width:102px}
.schedTable tbody th{height:64px;background:var(--accent-soft);color:#9C431B;border-radius:13px;font-size:24px}
.schedTable td{padding:0}
.schedTable input{box-sizing:border-box;width:100%;height:64px;padding:0 12px;border:3px solid var(--line);border-radius:14px;background:#F8FBF8;color:var(--ink);font:700 21px var(--body);text-align:center}
.schedTable input::placeholder{font-weight:500;color:#829087}
.schedTable input:focus{background:#fff;border-color:var(--sky)}
.schedPanel footer{border-top:2px solid var(--line)}
.schedPanel footer p{flex:1;font-size:18px;color:var(--muted);font-weight:700}
.schedPanel footer button{height:56px;padding:0 28px;border-radius:16px;background:var(--accent);color:#fff;font-size:21px;font-weight:700}
</style>

<body>

<div id="fit"><div id="stage">
  <header class="top">
    <div class="brand"><b id="cls">햇살반</b><span>아침 열기</span></div>

  </footer>
  <div class="sheet" id="sheet" hidden></div>
</div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['일','월','화','수','목','금','토'];
const ALLERGY={1:'난류',2:'우유',3:'메밀',4:'땅콩',5:'대두',6:'밀',7:'고등어',8:'게',9:'새우',10:'돼지고기',11:'복숭아',12:'토마토',13:'아황산류',14:'호두',15:'닭고기',16:'쇠고기',17:'오징어',18:'조개류',19:'잣'};
const STEP_DEF=[
  {id:'date',label:'날짜'},{id:'day',label:'요일'},{id:'weather',label:'날씨'},
  {id:'att',label:'출석'},{id:'mood',label:'기분'},{id:'plan',label:'일과'},
  {id:'lunch',label:'급식'},{id:'sum',label:'정리'}];
const MAIN_W=1360; /* 가운데 활동 영역 안쪽 너비 */

/* ---------- 저장 ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEFAULTS={
  cls:'햇살반',
  kids:['학생 1','학생 2','학생 3','학생 4'],
  plan:{1:'국어, 수학, 진로와 직업, 체육, 점심, 미술, 미술',
        2:'수학, 국어, 음악, 진로와 직업, 점심, 사회, 창체',
        3:'국어, 체육, 수학, 과학, 점심, 생활, 생활',
        4:'진로와 직업, 진로와 직업, 국어, 음악, 점심, 수학, 체육',
        5:'수학, 국어, 미술, 미술, 점심, 창체'},
  planCheck:true,
  lunch:'',
  mealMode:'auto',
  school:null,
  steps:{date:true,day:true,weather:true,att:true,mood:true,plan:true,lunch:true,sum:true},
  sample:false
};
let S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),store.get('morning:settings',{}));
S.steps=Object.assign({},DEFAULTS.steps,S.steps||{});S.steps.sum=true;
delete S.subjects;if(S.planCheck===undefined)S.planCheck=true;

const shared=new URLSearchParams(location.search);
if(/^\d{7,10}$/.test(shared.get('school')||'')&&/^[A-Z][0-9]{2}$/.test(shared.get('office')||'')){
  S.school={code:shared.get('school'),office:shared.get('office'),name:(shared.get('name')||'공유된 학교').slice(0,80),addr:(shared.get('address')||'').slice(0,120)};
  S.mealMode='auto';store.set('morning:settings',S);
  history.replaceState(null,'',location.pathname);
}
const now=new Date();
const T={y:now.getFullYear(),m:now.getMonth()+1,d:now.getDate(),w:now.getDay()};
const dayKey='morning:day:'+T.y+'-'+T.m+'-'+T.d;
const blankDay=()=>({att:{},mood:{},weather:null,feel:null,dateOk:{m:false,d:false},dayOk:false,pick:{},dishes:{}});
let D=Object.assign(blankDay(),store.get(dayKey,{}));if(!D.pick)D.pick={};if(!D.writing)D.writing={};
function saveDay(){store.set(dayKey,D)}

let steps=[],cur=0,sel=null,slotSel=null;
function buildSteps(){steps=STEP_DEF.filter(s=>S.steps[s.id]);if(cur>=steps.length)cur=steps.length-1}

let lastSay='';
function tone(){}
function speak(){}

/* ---------- 그림 ---------- */
function wIcon(k){
  const sun='<circle cx="50" cy="50" r="20" fill="#FFC63A"/>'+[0,45,90,135,180,225,270,315].map(a=>`<line x1="50" y1="18" x2="50" y2="8" stroke="#FFC63A" stroke-width="6" stroke-linecap="round" transform="rotate(${a} 50 50)"/>`).join('');
  const cloud=(x,y,c)=>`<g transform="translate(${x} ${y})"><circle cx="0" cy="0" r="16" fill="${c}"/><circle cx="20" cy="-8" r="20" fill="${c}"/><circle cx="40" cy="2" r="14" fill="${c}"/><rect x="-16" y="0" width="70" height="16" rx="8" fill="${c}"/></g>`;
  const map={
    sunny:sun,
    partly:`<g transform="translate(-2 -2) scale(.82)">${sun}</g>`+cloud(36,66,'#C9D4E2'),
    cloudy:cloud(18,44,'#AEBACB')+cloud(30,64,'#8E9BB0'),
    rain:cloud(22,40,'#8E9BB0')+[30,50,70].map((x,i)=>`<line x1="${x}" y1="${68+i%2*6}" x2="${x-6}" y2="${84+i%2*6}" stroke="#3F8FDE" stroke-width="6" stroke-linecap="round"/>`).join(''),
    snow:cloud(22,40,'#AEBACB')+[30,50,70].map((x,i)=>`<circle cx="${x}" cy="${76+i%2*8}" r="6" fill="#fff" stroke="#3F8FDE" stroke-width="3"/>`).join(''),
    wind:`<path d="M12 36h50a10 10 0 10-10-10M12 54h68a12 12 0 11-12 12M12 72h36" fill="none" stroke="#5D6A7C" stroke-width="7" stroke-linecap="round"/>`
  };return `<svg viewBox="0 0 100 100" aria-hidden="true">${map[k]}</svg>`;}
const MOODS=[
  {k:'joy',t:'기뻐요',c:'#FFC63A'},{k:'fun',t:'신나요',c:'#F2732B'},{k:'calm',t:'편안해요',c:'#7FCFA0'},
  {k:'sleepy',t:'졸려요',c:'#B7A7E8'},{k:'sad',t:'슬퍼요',c:'#7FB4EA'},{k:'mad',t:'화나요',c:'#E8607E'}];
function face(k){
  const m=MOODS.find(x=>x.k===k);if(!m)return'';const ink='#1E2944';
  const eyes={joy:`<path d="M32 42q6-8 12 0M56 42q6-8 12 0" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
    fun:`<path d="M30 44l8-8 8 8M54 44l8-8 8 8" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
    calm:`<path d="M31 42h13M56 42h13" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>`,
    sleepy:`<path d="M31 44q6 5 12 0M57 44q6 5 12 0" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
    sad:`<circle cx="38" cy="42" r="5" fill="${ink}"/><circle cx="62" cy="42" r="5" fill="${ink}"/><path d="M68 50q4 8 0 11q-4-3 0-11" fill="#3F8FDE"/>`,
    mad:`<path d="M30 34l14 6M70 34l-14 6" stroke="${ink}" stroke-width="5" stroke-linecap="round"/><circle cx="38" cy="45" r="5" fill="${ink}"/><circle cx="62" cy="45" r="5" fill="${ink}"/>`}[k];
  const mouth={joy:'<path d="M34 60q16 16 32 0" stroke-width="5"/>',fun:'<path d="M32 58h36q-4 18-18 18t-18-18z" fill="#1E2944"/>',
    calm:'<path d="M38 62q12 7 24 0" stroke-width="5"/>',sleepy:'<ellipse cx="50" cy="66" rx="6" ry="7" fill="#1E2944"/>',
    sad:'<path d="M36 70q14-12 28 0" stroke-width="5"/>',mad:'<path d="M36 68q14-8 28 0" stroke-width="5"/>'}[k];
  const z=k==='sleepy'?'<path d="M70 14h10l-10 12h10" stroke="#1E2944" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':'';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="${m.c}"/>${eyes}<g stroke="${ink}" fill="none" stroke-linecap="round">${mouth}</g>${z}</svg>`;}
function subjIcon(s){
  const I='#1E2944';let b;
  if(/점심|급식/.test(s))b='<path d="M14 50h72a36 30 0 01-72 0z" fill="#F2732B"/><path d="M30 46q20-26 40 0" fill="#fff" stroke="#1E2944" stroke-width="4"/><path d="M60 14l18 30M70 12l14 30" stroke="#1E2944" stroke-width="4" stroke-linecap="round"/>';
  else if(/국어|읽기|한글/.test(s))b='<path d="M50 28q-18-10-36-6v54q18-4 36 6q18-10 36-6V22q-18-4-36 6z" fill="#7FB4EA" stroke="#1E2944" stroke-width="4" stroke-linejoin="round"/><path d="M50 28v54" stroke="#1E2944" stroke-width="4"/>';
  else if(/수학|셈/.test(s))b='<rect x="16" y="16" width="68" height="68" rx="14" fill="#FFC63A"/><path d="M34 32v20M24 42h20M58 42h18M58 64l14 14M72 64L58 78M24 70h20" stroke="#1E2944" stroke-width="5" stroke-linecap="round"/>';
  else if(/진로|직업/.test(s))b='<rect x="14" y="34" width="72" height="46" rx="8" fill="#B07A4E"/><path d="M38 34v-8a6 6 0 016-6h12a6 6 0 016 6v8" fill="none" stroke="#1E2944" stroke-width="5"/><rect x="44" y="50" width="12" height="10" rx="2" fill="#FFC63A"/><path d="M14 52h72" stroke="#1E2944" stroke-width="3"/>';
  else if(/체육|운동/.test(s))b='<circle cx="50" cy="50" r="34" fill="#fff" stroke="#1E2944" stroke-width="4"/><path d="M50 34l14 10-5 16H41l-5-16z" fill="#1E2944"/><path d="M50 16v18M64 44l16-6M59 60l10 14M41 60l-10 14M36 44l-16-6" stroke="#1E2944" stroke-width="3"/>';
  else if(/음악|노래/.test(s))b='<path d="M40 70V26l34-8v44" fill="none" stroke="#1E2944" stroke-width="5"/><ellipse cx="32" cy="70" rx="12" ry="9" fill="#DE4870"/><ellipse cx="66" cy="62" rx="12" ry="9" fill="#DE4870"/>';
  else if(/미술|그리기|만들기/.test(s))b='<path d="M22 70q-6-34 28-44t30 22q-2 12-14 8t-12 10q0 12-14 12T22 70z" fill="#FFE6D6" stroke="#1E2944" stroke-width="4"/><circle cx="38" cy="44" r="6" fill="#DE4870"/><circle cx="56" cy="38" r="6" fill="#3F8FDE"/><circle cx="68" cy="52" r="6" fill="#2E9B66"/>';
  else if(/과학|실험/.test(s))b='<path d="M40 16h20M44 16v24L24 76a6 6 0 005 8h42a6 6 0 005-8L56 40V16" fill="#DDF3E7" stroke="#1E2944" stroke-width="4" stroke-linejoin="round"/><path d="M32 64h36l6 12H26z" fill="#2E9B66"/>';
  else if(/사회|지리/.test(s))b='<circle cx="50" cy="50" r="34" fill="#7FB4EA" stroke="#1E2944" stroke-width="4"/><path d="M30 34q10 4 8 14t10 10q-2 12 6 16M60 22q-4 10 6 14t14 4" fill="#7FCFA0" stroke="#1E2944" stroke-width="3"/>';
  else if(/생활|가정|요리/.test(s))b='<path d="M16 48L50 20l34 28v34H16z" fill="#FFC63A" stroke="#1E2944" stroke-width="4" stroke-linejoin="round"/><rect x="42" y="56" width="16" height="26" fill="#fff" stroke="#1E2944" stroke-width="4"/>';
  else if(/창체|동아리|자율|행사|체험/.test(s))b='<path d="M50 12l11 24 26 3-19 18 5 26-23-13-23 13 5-26-19-18 26-3z" fill="#FFC63A" stroke="#1E2944" stroke-width="4" stroke-linejoin="round"/>';
  else b=`<circle cx="50" cy="50" r="34" fill="#DDF3E7" stroke="${I}" stroke-width="4"/><text x="50" y="63" text-anchor="middle" font-family="Jua,sans-serif" font-size="38" fill="${I}">${esc((s||'?').slice(0,1))}</text>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${b}</svg>`;}
function dishIcon(i,sz){
  const a=`width="${sz}" height="${sz}" viewBox="0 0 100 100" aria-hidden="true"`;
  if(i===0)return `<svg ${a}><path d="M14 46h72a36 34 0 01-72 0z" fill="#fff" stroke="#1E2944" stroke-width="4"/><path d="M22 46q8-22 28-22t28 22" fill="#F4EEE2" stroke="#1E2944" stroke-width="4"/><circle cx="40" cy="36" r="3" fill="#7A5A3A"/><circle cx="56" cy="32" r="3" fill="#7A5A3A"/><circle cx="62" cy="40" r="3" fill="#7A5A3A"/></svg>`;
  if(i===1)return `<svg ${a}><path d="M12 44h76a38 36 0 01-76 0z" fill="#fff" stroke="#1E2944" stroke-width="4"/><ellipse cx="50" cy="46" rx="34" ry="6" fill="#E9A65A"/><path d="M38 30q4-8 0-14M52 30q4-8 0-14M66 30q4-8 0-14" stroke="#9AA6B8" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
  return `<svg ${a}><ellipse cx="50" cy="60" rx="40" ry="18" fill="#fff" stroke="#1E2944" stroke-width="4"/><path d="M28 58q22-20 44 0" fill="${['#2E9B66','#DE4870','#FFC63A','#E9A65A'][i%4]}" stroke="#1E2944" stroke-width="3"/></svg>`;}

/* ---------- 도우미 ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const jong=s=>{const c=String(s).charCodeAt(String(s).length-1)-44032;return c>=0&&c<11172&&c%28>0};
const ieyo=s=>s+(jong(s)?'이에요':'예요');
const eunneun=s=>s+(jong(s)?'은':'는');
const eul=s=>s+(jong(s)?'을':'를');
function parseDish(line){const m=line.match(/^(.*?)[\s(]*((?:\d{1,2}\s*[.,]\s*)*\d{1,2})\s*\.?\)?\s*$/);
  if(m&&m[1].trim())return{name:m[1].replace(/[\s(]+$/,'').trim(),al:m[2].split(/[.,]/).map(n=>+n.trim()).filter(n=>ALLERGY[n])};
  return{name:line.trim(),al:[]}}
const splitList=s=>String(s||'').split(/[,，\n]/).map(x=>x.trim()).filter(Boolean);
const isLunch=s=>/점심|급식/.test(s);
const planToday=()=>(T.w>=1&&T.w<=5)?splitList(S.plan[T.w]).slice(0,9):[];
const ymd=`${T.y}${String(T.m).padStart(2,'0')}${String(T.d).padStart(2,'0')}`;
/* 나이스 메뉴 이름 정리: 별표·# 표시와 (안)(J)(고) 같은 짧은 표시 지우기 */
const cleanNeis=l=>String(l).replace(/[#*]/g,'').replace(/\((?![\d.,\s]+\))[^)]{1,2}\)/g,'').replace(/[@-].*$/,'').replace(/\s{2,}/g,' ').trim();
/* 나이스 교육정보 개방 포털 Open API */
async function neis(service,params){
  const q=new URLSearchParams(params);
  const res=await fetch(`https://morning-board-classroom-2026.zxc3285.chatgpt.site/api/${service}?${q}`,{headers:{Accept:'application/json'}});
  const j=await res.json();
  if(!res.ok)throw new Error(j.error||'학교 정보를 가져오지 못했어요');
  return j.rows||[];
}
let meal={state:'idle',lines:[]};
async function loadMeal(){
  if(S.mealMode!=='auto'||!S.school){meal={state:'idle',lines:[]};refreshLunch();return}
  const key=`morning:meal:v2:${S.school.code}:${ymd}`,hit=store.get(key,null);
  if(hit&&hit.state==='ok'&&Date.now()-hit.savedAt<2*60*60*1000){meal=hit;refreshLunch();return}
  if(T.w===0||T.w===6){meal={state:'noday',lines:[]};refreshLunch();return}
  meal={state:'loading',lines:[]};refreshLunch();
  try{
    const rows=await neis('mealServiceDietInfo',{ATPT_OFCDC_SC_CODE:S.school.office,SD_SCHUL_CODE:S.school.code,MLSV_YMD:ymd});
    const r=rows.find(x=>x.MMEAL_SC_NM==='중식')||rows[0];
    meal=r?{state:'ok',lines:String(r.DDISH_NM).split(/<br\s*\/?>/i).map(cleanNeis).filter(Boolean)}:{state:'noday',lines:[]};
    if(meal.state==='ok')store.set(key,{...meal,savedAt:Date.now()});
  }catch(e){meal={state:'error',lines:[],error:e.message}}
  refreshLunch();
}
function autoMeal(){
  if(S.mealMode!=='auto'||!S.school)return null;
  return meal.state==='idle'?{state:'loading',lines:[]}:meal;
}
const dishes=()=>{const a=autoMeal();return(a?a.lines:S.lunch.split('\n')).map(x=>x.trim()).filter(Boolean).map(parseDish).slice(0,12)};
const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
function setSay(el,text,ok){if(!el)return;el.textContent=text;el.className=el.className.replace(/\s*(pop|try)/g,'');void el.offsetWidth;el.classList.add('pop');if(ok===false)el.classList.add('try')}
function choices(box,opts,good,onGood,sayEl,label){
  box.innerHTML=opts.map((o,i)=>`<button class="choice" data-i="${i}">${label?label(o):o}</button>`).join('');
  box.onclick=e=>{const b=e.target.closest('.choice');if(!b)return;const o=opts[+b.dataset.i];
    if(o===good){b.classList.add('yes');[...box.children].forEach(x=>x!==b&&x.classList.add('no'));tone(true);onGood(b)}
    else{b.classList.add('no');tone(false);setSay(sayEl,'다시 찾아봐요',false);speak('다시 찾아봐요')}}}
function markGood(box,good,opts){[...box.children].forEach((x,i)=>x.classList.add(opts[i]===good?'yes':'no'))}

/* ---------- 단계 화면 ---------- */
const R={};
R.date=m=>{
  const mm=D.dateOk.m,dd=D.dateOk.d;
  m.innerHTML=`<div class="dateWrap">
    <div class="ilryeok"><div class="rings"><span></span><span></span></div>
      <div class="head" id="ilM">${T.y}년 ${mm?T.m+'월':'<span style="opacity:.6">?월</span>'}</div>
      <div class="num ${dd?'':'unk'}" id="ilD">${dd?T.d:'?'}</div>
      <div class="wd" id="ilW">${dd?'오늘':'&nbsp;'}</div></div>
    <div class="dateQ">
      <div><span class="qtag" id="qtag">${!mm?'첫 번째':'두 번째'}</span><h1 class="q" id="dq">${!mm?'오늘은 몇 월이에요?':'오늘은 며칠이에요?'}</h1>
      <p class="sub">달력과 칠판을 보고 찾아봐요</p></div>
      <div class="row3" id="opts"></div><div class="say" id="say"></div></div></div>`;
  const box=$('#opts'),say=$('#say');
  function askDay(){
    const last=new Date(T.y,T.m,0).getDate();const pool=new Set([T.d]);
    const cand=[-3,-2,-1,1,2,3,7,-7].map(x=>T.d+x).filter(n=>n>=1&&n<=last);

    overlay.querySelector('#writingClose').onclick=close;
    overlay.querySelector('#writingClear').onclick=()=>{paths=[];D.writing[i]={name,paths};saveDay();renderInk()};
    overlay.querySelector('#writingNext').onclick=()=>{close();if(i<ds.length-1)openPractice(i+1)};
    overlay.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}};
    overlay.querySelector('#writingClose').focus();
  };
  $('#tray').onclick=e=>{const card=e.target.closest('.dish');if(card)openPractice(+card.dataset.i)};
  lastSay='오늘 점심은 '+ds.map(x=>x.name).join(', ')+(ds.length?'이에요.':'');
};
R.sum=m=>{
  const a=S.kids.filter(k=>D.att[k]==='in').length,ds=dishes();
  const items=planToday();const learned=uniq(items.map((s,i)=>isLunch(s)?null:(D.pick[i]||s)).filter(Boolean));
  const w=WEATHER.find(x=>x.k===D.weather),f=FEEL.find(x=>x.k===D.feel);
  const groups=MOODS.map(md=>({md,ks:S.kids.filter(k=>D.mood[k]===md.k)})).filter(g=>g.ks.length);
  m.innerHTML=`<div class="qrow"><div><h1 class="q">오늘 아침을 정리해요</h1></div></div>
    <div class="sum">
      <div class="box big"><div><h3>오늘은</h3><p>${T.y}년<br>${T.m}월 ${T.d}일<br><span style="color:${T.w===0?'#FF9DB4':T.w===6?'#9CCBFF':'#FFFFFF'}">${WD[T.w]}요일</span></p></div>
        <p class="cheer">오늘도 힘차게<br>시작해요!</p></div>
      <div class="mid">
        <div class="box"><h3>날씨</h3><p class="wx">${w?wIcon(w.k)+`<span>${w.n}${f?' · '+f.t:''}</span>`:'아직 안 골랐어요'}</p></div>
        <div class="box"><h3>출석</h3><p>${a}명 / ${S.kids.length}명</p></div>
        <div class="box wide"><h3>오늘 배워요</h3><p class="two" style="font-size:${learned.join('').length>24?24:28}px">${learned.length?learned.map(esc).join(' · '):'쉬는 날'}</p></div>
        <div class="box wide"><h3>점심</h3><p class="two">${ds.length?ds.slice(0,4).map(x=>esc(x.name)).join(' · ')+(ds.length>4?` <span style="color:var(--muted)">외 ${ds.length-4}가지</span>`:''):'없음'}</p></div>
      </div>
      <div class="box"><h3>우리 반 기분</h3>${groups.length?`<div class="mlist">${groups.map(g=>`<div>${face(g.md.k)}<span class="mt"><span>${g.md.t} ${g.ks.length}명</span><small>${g.ks.map(esc).join(', ')}</small></span></div>`).join('')}</div>`:'<p style="font-size:28px">아직 안 골랐어요</p>'}</div>
    </div>`;
  lastSay=`오늘은 ${T.m}월 ${T.d}일 ${WD[T.w]}요일이에요. ${w?weatherLine():''} 오늘 ${a}명이 왔어요. 오늘도 힘차게 시작해요!`;
};

/* ---------- 진행 ---------- */
function isDone(id){const p=planToday(),ds=dishes(),here=S.kids.filter(k=>D.att[k]!=='out');
  return{date:D.dateOk.m&&D.dateOk.d,day:D.dayOk,weather:!!(D.weather&&D.feel),att:S.kids.length>0&&S.kids.every(k=>D.att[k]),
  mood:here.length>0&&here.every(k=>D.mood[k]),plan:p.every((s,i)=>isLunch(s)||D.pick[i]),lunch:ds.length>0&&ds.every((_,i)=>D.dishes[i]),sum:false}[id]}
function paintSteps(){$('#steps').innerHTML=steps.map((s,i)=>{const d=isDone(s.id)&&i!==cur;return `${i?'<span class="sep"></span>':''}<button class="chip ${i===cur?'now':''} ${d?'done':''}" data-i="${i}" ${i===cur?'aria-current="step"':''}><i>${d?'✓':i+1}</i>${s.label}</button>`}).join('')}
function go(i,talk){cur=Math.max(0,Math.min(steps.length-1,i));const m=$('#main');m.innerHTML='';R[steps[cur].id](m);paintSteps();
  $('#prev').disabled=cur===0;$('#next').disabled=cur===steps.length-1;
  $('#hint').innerHTML=`<span class="step-badge"><span class="step-count">${cur+1}</span>${steps[cur].label}</span>`;
}
$('#steps').onclick=e=>{const b=e.target.closest('.chip');if(b)go(+b.dataset.i)};
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#homeBtn').onclick=()=>go(0,false);
document.addEventListener('keydown',e=>{if(!$('#sheet').hidden||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});
$('#fsBtn').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();p&&p.catch&&p.catch(()=>toast('이 화면에서는 전체 화면을 쓸 수 없어요'))}catch(e){toast('이 화면에서는 전체 화면을 쓸 수 없어요')}};

/* ---------- 선생님 ---------- */
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#stage').appendChild(d);setTimeout(()=>d.remove(),1800)}
$('#shareBtn').onclick=async()=>{
  const u=new URL(location.origin+location.pathname);
  if(S.school){u.searchParams.set('school',S.school.code);u.searchParams.set('office',S.school.office);
    u.searchParams.set('name',S.school.name);u.searchParams.set('address',S.school.addr||'')}
  try{await navigator.clipboard.writeText(u.toString());toast(S.school?'학교가 포함된 링크를 복사했어요':'링크를 복사했어요')}
  catch(e){prompt('이 링크를 복사해 주세요',u.toString())}
};
$('#tBtn').onclick=()=>{
  const sh=$('#sheet');sh.hidden=false;
  sh.innerHTML=`<div class="panel" role="dialog" aria-label="선생님 설정"><header><h2>선생님 설정</h2><button class="btn" id="xBtn">닫기</button></header>
   <div class="pbody">
    <div>
      <div class="f"><label for="sCls">반 이름</label><input type="text" id="sCls" maxlength="12" value="${esc(S.cls)}"></div>
      <div class="f"><label for="sKids">학생 이름</label><small>한 줄에 한 명 · 최대 18명</small><textarea id="sKids" style="min-height:190px">${esc(S.kids.join('\n'))}</textarea></div>
      <div class="f"><span class="lab">할 활동</span><div class="checks">${STEP_DEF.filter(s=>s.id!=='sum').map(s=>`<label><input type="checkbox" id="sS_${s.id}" ${S.steps[s.id]?'checked':''}>${s.label}</label>`).join('')}</div></div>
    </div>
    <div>
      <div class="f"><span class="lab">요일별 시간표</span><small>월요일부터 금요일까지 표에 과목을 넣어요.</small>
        <button class="schedOpen" id="editSchedule" type="button">시간표 표로 입력하기</button>
        <small id="schedSummary">1교시부터 최대 9교시까지 입력할 수 있어요.</small>
        ${[1,2,3,4,5].map(w=>`<input type="hidden" id="sP${w}" value="${esc(S.plan[w]||'')}">`).join('')}</div>
      <div class="f"><span class="lab">학생이 고를 과목 카드</span><small>월요일부터 금요일까지 시간표에 있는 과목을 모두 보여줘요. 점심과 같은 과목의 중복은 빼요.</small></div>
      <div class="f"><span class="lab">일과 고르기 방법</span><div class="checks one"><label><input type="checkbox" id="sCheck" ${S.planCheck?'checked':''}>시간표와 맞는지 확인하기 (끄면 자유롭게 넣어요)</label></div></div>
    </div>
    <div>
      <div class="f"><span class="lab">급식 가져오기</span><div class="seg" role="radiogroup">
        <label><input type="radio" name="sMeal" id="sMealAuto" value="auto" ${S.mealMode==='auto'?'checked':''}>학교 급식 자동</label>
        <label><input type="radio" name="sMeal" id="sMealMan" value="manual" ${S.mealMode!=='auto'?'checked':''}>직접 입력</label></div></div>
      <div id="autoBox" ${S.mealMode==='auto'?'':'hidden'}>
        <div class="f"><span class="lab">우리 학교</span><div class="school" id="curSchool">${S.school?`<b>${esc(S.school.name)}</b><small>${esc(S.school.addr||'')}</small>`:'<small>아직 정하지 않았어요</small>'}</div></div>
        <div class="f"><label for="sQ">학교 찾기</label><div class="srch"><input type="text" id="sQ" placeholder="예: 해솔학교"><button class="btn" id="sGo">찾기</button></div>
          <small id="reqMsg">학교 이름을 넣고 찾기를 눌러요.</small><div class="res" id="reqRes"></div></div>
      </div>
      <div class="f" id="manBox" ${S.mealMode==='auto'?'hidden':''}><label for="sLunch">오늘 급식</label><small>한 줄에 한 가지(최대 12개). 알레르기 번호는 뒤에 (5.6.13)처럼 써요</small><textarea id="sLunch" style="min-height:230px">${esc(S.lunch)}</textarea></div>
      <p class="pnote">학교를 고르면 매일 날짜에 맞는 급식을 불러와요. 학생 이름과 활동 기록은 이 기기에만 저장돼요.</p>
    </div>
   </div>
   <footer><button class="btn warn" id="rBtn">오늘 기록 지우기</button><button class="btn" id="dBtn">예시로 되돌리기</button><button class="btn main" id="okBtn">저장하고 닫기</button></footer></div>`;
  $('#editSchedule').onclick=()=>{
    const days=[1,2,3,4,5];
    const values=Object.fromEntries(days.map(w=>[w,splitList($('#sP'+w).value).slice(0,9)]));
    const subjects=uniq([...days.flatMap(w=>values[w]),'점심']);
    const overlay=document.createElement('div');overlay.className='schedOverlay';
    overlay.innerHTML=`<div class="schedPanel" role="dialog" aria-modal="true" aria-label="요일별 시간표 입력">
      <header><h2>요일별 시간표</h2><button id="scheduleCancel" type="button">닫기</button></header>
      <div class="schedScroll"><table class="schedTable"><thead><tr><th scope="col">교시</th>${days.map(w=>`<th scope="col">${WD[w]}요일</th>`).join('')}</tr></thead>
      <tbody>${Array.from({length:9},(_,i)=>`<tr><th scope="row">${i+1}교시</th>${days.map(w=>`<td><input type="text" data-day="${w}" data-period="${i}" list="scheduleSubjects" maxlength="24" aria-label="${WD[w]}요일 ${i+1}교시" placeholder="과목"></td>`).join('')}</tr>`).join('')}</tbody></table>
      <datalist id="scheduleSubjects">${subjects.map(s=>`<option value="${esc(s)}"></option>`).join('')}</datalist></div>
      <footer><p id="scheduleHelp" role="status">한셀·엑셀에서 표를 복사한 뒤 월요일 1교시 칸에 붙여넣으세요. 아래로 내려 8·9교시도 입력할 수 있어요.</p><button id="scheduleApply" type="button">표 적용</button></footer></div>`;
    sh.appendChild(overlay);
    days.forEach(w=>values[w].forEach((v,i)=>{overlay.querySelector(`[data-day="${w}"][data-period="${i}"]`).value=v}));
    overlay.querySelector('.schedTable').addEventListener('paste',e=>{
      const target=e.target.closest('input[data-day][data-period]');
      if(!target)return;
      const text=e.clipboardData.getData('text/plain');
      if(!/[\t\r\n]/.test(text))return;
      e.preventDefault();
      const rows=text.replace(/\r\n?/g,'\n').replace(/\n$/,'').split('\n').map(line=>line.split('\t').map(cell=>cell.trim()));
      const dayOf=value=>({월:1,월요일:1,화:2,화요일:2,수:3,수요일:3,목:4,목요일:4,금:5,금요일:5})[value.replace(/\s/g,'')]||0;
      const periodOf=value=>{const m=/^(\d{1,2})\s*(?:교시)?$/.exec(value);return m?Number(m[1])-1:null};
      const header=rows[0].map(dayOf),hasHeader=header.filter(Boolean).length>=2;
      if(hasHeader)rows.shift();
      const hasPeriods=rows.length>0&&rows.every(row=>periodOf(row[0]||'')!==null&&row.length>1);
      const startDay=Number(target.dataset.day),startPeriod=Number(target.dataset.period);
      let count=0;
      rows.forEach((row,ri)=>{
        const period=hasPeriods?periodOf(row[0]):startPeriod+ri;
        if(period<0||period>8)return;
        row.forEach((value,ci)=>{
          if(hasPeriods&&ci===0)return;
          const day=hasHeader?header[ci-(hasPeriods&&header[0]?1:0)]:startDay+ci-(hasPeriods?1:0);
          if(day<1||day>5)return;
          const cell=overlay.querySelector(`[data-day="${day}"][data-period="${period}"]`);
          if(cell){cell.value=value.slice(0,24);count++}
        });
      });
      overlay.querySelector('#scheduleHelp').textContent=count?`${count}칸에 붙여넣었어요. 확인한 뒤 표 적용을 눌러 주세요.`:'붙여넣을 칸을 찾지 못했어요. 월요일 1교시 칸에서 다시 해 주세요.';
    });
    const closeSchedule=()=>{overlay.remove();$('#editSchedule').focus()};
    overlay.querySelector('#scheduleCancel').onclick=closeSchedule;
    overlay.querySelector('#scheduleApply').onclick=()=>{
      days.forEach(w=>{$('#sP'+w).value=Array.from({length:9},(_,i)=>overlay.querySelector(`[data-day="${w}"][data-period="${i}"]`).value.trim()).filter(Boolean).join(', ')});
      closeSchedule();$('#schedSummary').textContent='시간표를 입력했어요. 아래 저장하고 닫기를 눌러 주세요.'};
    overlay.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();closeSchedule()}};
    overlay.querySelector('[data-day="1"][data-period="0"]').focus();
  };
  const close=()=>{sh.hidden=true;sh.innerHTML='';$('#tBtn').focus()};
  let chosen=S.school;
  sh.querySelectorAll('input[name=sMeal]').forEach(r=>r.onchange=()=>{const a=$('#sMealAuto').checked;$('#autoBox').hidden=!a;$('#manBox').hidden=a});
  const showCur=()=>{$('#curSchool').innerHTML=chosen?`<b>${esc(chosen.name)}</b><small>${esc(chosen.addr||'')}</small>`:'<small>아직 정하지 않았어요</small>'};
  const search=async()=>{const q=$('#sQ').value.trim(),msg=$('#reqMsg'),res=$('#reqRes');if(!q){$('#sQ').focus();return}
    msg.textContent='찾고 있어요…';res.innerHTML='';
    let rs;try{rs=await neis('schoolInfo',{SCHUL_NM:q})}catch(e){msg.textContent=e.message;return}
    if(!rs.length){msg.textContent=`‘${q}’ 학교를 찾지 못했어요. 이름을 짧게 줄여서 다시 찾아봐요.`;return}
    msg.textContent=rs.length>=20?'결과가 많아요. 이름을 더 정확히 쓰면 좋아요. 우리 학교를 눌러 골라요.':'우리 학교를 눌러 골라요.';
    res.innerHTML=rs.map((r,i)=>`<button class="btn" data-i="${i}"><b>${esc(r.SCHUL_NM)}</b><small>${esc(r.ORG_RDNMA||r.LCTN_SC_NM||'')}</small></button>`).join('');
    res.onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=rs[+b.dataset.i];
      chosen={office:String(r.ATPT_OFCDC_SC_CODE),code:String(r.SD_SCHUL_CODE),name:String(r.SCHUL_NM),addr:String(r.ORG_RDNMA||'')};showCur();
      [...res.children].forEach(x=>x.classList.toggle('on',x===b))}};
  $('#sGo').onclick=search;
  $('#sQ').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};
  $('#xBtn').onclick=close;
  let arm=false;
  $('#rBtn').onclick=e=>{if(!arm){arm=true;e.target.classList.add('arm');e.target.textContent='한 번 더 누르면 지워져요';return}
    D=blankDay();saveDay();sel=null;slotSel=null;close();go(0,false);toast('오늘 기록을 지웠어요')};
  $('#dBtn').onclick=()=>{S=JSON.parse(JSON.stringify(DEFAULTS));store.set('morning:settings',S);close();applyS(true);toast('예시 설정으로 되돌렸어요')};
  $('#okBtn').onclick=()=>{
    const kids=uniq($('#sKids').value.split('\n').map(x=>x.trim()).filter(Boolean)).slice(0,18);
    const plan={};let planChanged=false;[1,2,3,4,5].forEach(w=>{plan[w]=$('#sP'+w).value.trim();if(plan[w]!==S.plan[w])planChanged=true});
    const st={sum:true};STEP_DEF.forEach(s=>{if(s.id!=='sum')st[s.id]=$('#sS_'+s.id).checked});
    const lunch=$('#sLunch').value.trim();
    const mealMode=$('#sMealAuto').checked?'auto':'manual';
    const mealChanged=lunch!==S.lunch||mealMode!==S.mealMode||(chosen&&chosen.code)!==(S.school&&S.school.code);
    if(planChanged)D.pick={};if(mealChanged){D.dishes={};D.writing={}};saveDay();
    S=Object.assign(S,{cls:$('#sCls').value.trim()||'우리 반',kids:kids.length?kids:['학생'],plan,
      planCheck:$('#sCheck').checked,lunch,steps:st,sample:S.sample&&lunch===DEFAULTS.lunch,mealMode,school:chosen||null,
});
    store.set('morning:settings',S);close();applyS();loadMeal();
    toast(mealMode==='auto'&&!chosen?'저장했어요. 학교를 고르면 급식이 나와요':'저장했어요')};
  setTimeout(()=>$('#sCls').focus(),50);
};
function refreshLunch(){if(!steps.length)return;paintSteps();if(steps[cur]&&(steps[cur].id==='lunch'||steps[cur].id==='sum')&&$('#sheet').hidden)go(cur,false)}
function setCls(){const c=$('#cls');c.textContent=S.cls;c.style.fontSize=Math.max(20,Math.min(34,Math.floor(250/Math.max(S.cls.length*.95,1))))+'px'}
function applyS(){setCls();const id=steps[cur]&&steps[cur].id;buildSteps();slotSel=null;sel=null;const j=steps.findIndex(s=>s.id===id);go(j<0?0:j,false)}

/* ---------- 화면 맞추기 · 시계 ---------- */
function fit(){const f=$('#fit'),w=f.clientWidth,h=f.clientHeight;if(!w||!h)return;const s=Math.min(w/1440,h/810);const st=$('#stage');
  st.style.transform=`scale(${s})`;st.style.left=((w-1440*s)/2)+'px';st.style.top=((h-810*s)/2)+'px'}
addEventListener('resize',fit);
function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes();$('#clock').textContent=(h<12?'오전 ':'오후 ')+(h%12||12)+':'+String(m).padStart(2,'0')}
setInterval(()=>{tick();const d=new Date();if(d.getFullYear()!==T.y||d.getMonth()+1!==T.m||d.getDate()!==T.d)location.reload()},10000);tick();
setCls();buildSteps();fit();go(0,false);
loadMeal();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(steps[cur])go(cur,false)});
})();
</script>
